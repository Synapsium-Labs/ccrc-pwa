<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Drive your Claude Code fleet from anywhere." />
    <!-- --bg-page (tokens.css) for both themes; lib/theme.ts keeps the plain
         meta in sync with the applied theme after boot. -->
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F3" />
    <!-- Pre-paint theme + no-white-flash guard: stamp the light theme before
         the bundle loads and paint the page background immediately. Values
         mirror --bg-page in tokens.css (which can't be loaded yet). -->
    <style>
      html {
        background: #0b0d0c;
      }
      html[data-theme='light'] {
        background: #f4f6f3;
      }
    </style>
    <script>
      try {
        if (matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ccrc" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>ccrc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
