<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Drive your Claude Code fleet from anywhere." />
    <!-- --bg-page (tokens.css) for both themes; lib/theme.ts keeps the plain
         meta in sync with the applied theme after boot.

         THESE FOUR HEXES MUST BE LITERALS and cannot be var(): a <meta> takes
         no custom property, and the <style> below has to paint before any
         stylesheet has loaded — that is the whole point of it. So they are
         BOUND instead of deduplicated: test/contrast.test.ts parses this file
         and fails if any of them stops equalling --bg-page in tokens.css, in
         the theme the surrounding markup names. Retune --bg-page and the gate
         tells you these four (and vite.config.ts's two manifest colours) are
         now the old colour, instead of leaving the pre-paint flash, the browser
         chrome and the install splash quietly behind. -->
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F6F3" />
    <!-- Pre-paint theme + no-white-flash guard: stamp the light theme before
         the bundle loads and paint the page background immediately. Values
         mirror --bg-page in tokens.css (which can't be loaded yet). -->
    <style>
      html {
        background: #0b0d0c;
      }
      html[data-theme='light'] {
        background: #f4f6f3;
      }
    </style>
    <script>
      // Pre-paint theme stamp. A STORED choice wins; with none, follow the OS
      // between the two Phosphor palettes — which is what this did before
      // themes became selectable.
      //
      // Deliberately NOT validated against the theme catalogue: that list
      // lives in the bundle, which has not loaded yet, and duplicating it here
      // is the second copy `single-definition` forbids. An unknown value
      // stamps an attribute no block answers, every token falls through to
      // :root, and `initTheme` corrects it the moment the bundle runs — one
      // frame, no wrong-palette persistence. The ONE thing this must not do is
      // throw: storage is unreadable in a private window, and an exception
      // here is a blank app.
      //
      // The <style> above only knows the two Phosphor backgrounds, so a pinned
      // third-party palette shows one frame of Phosphor's ground before its
      // own stylesheet lands. Accepted: the alternative is eleven more bound
      // literals in this file for a single frame.
      try {
        var t = null;
        try { t = localStorage.getItem('ccrc-theme'); } catch {}
        if (t === null || t === '' || t === 'system') {
          if (matchMedia('(prefers-color-scheme: light)').matches)
            document.documentElement.setAttribute('data-theme', 'light');
        } else if (t !== 'phosphor') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ccrc" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>ccrc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
