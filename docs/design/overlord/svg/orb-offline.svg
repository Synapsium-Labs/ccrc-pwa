<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="The Orb offline: greyed out with its eye crossed out, not moving"><style>.md-hop{animation:md-up2 1.2s steps(1) infinite}
.md-shake{animation:md-up1 .3s steps(1) infinite}
.md-sob{animation:md-up1 .6s steps(1) infinite}
.md-breathe{animation:md-up1 4s steps(1) infinite}
.md-z1{animation:md-z1 2.4s steps(1) infinite}
.md-z2{animation:md-z2 2.4s steps(1) infinite}
.md-tear{animation:md-tear 1.2s steps(6) infinite}
.md-tremble{animation:md-tremble .16s steps(1) infinite}
.md-dart{animation:md-dart 1.6s steps(1) infinite}
@keyframes md-tremble{0%{transform:translateX(0)}50%{transform:translateX(1px)}}
@keyframes md-dart{0%{transform:translate(-3px,0)}25%{transform:translate(3px,0)}50%{transform:translate(-3px,0)}75%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.md-tremble,.md-dart{animation:none}}
.md-look{animation:md-look 7s steps(1) infinite}
.md-blink{transform-box:fill-box;transform-origin:50% 66.67%;animation:md-blink 5s steps(1) infinite}
.md-dot{animation:md-dot 1.5s steps(1) infinite}
.md-flash{animation:md-flash .8s steps(1) infinite}
.md-sus{animation:md-sus 4s steps(1) infinite}
.md-orbit{animation:md-orbit 1s steps(1) infinite}
.md-sway{animation:md-tremble 1s steps(1) infinite}
@keyframes md-look{0%{transform:translate(0,0)}30%{transform:translate(5px,0)}50%{transform:translate(-5px,0)}70%{transform:translate(0,0)}}
@keyframes md-blink{0%{transform:scaleY(1)}96%{transform:scaleY(.25)}}
@keyframes md-dot{0%{opacity:1}33%{opacity:.25}}
@keyframes md-flash{0%{opacity:1}50%{opacity:.2}}
@keyframes md-sus{0%{transform:translate(-5px,0)}50%{transform:translate(5px,0)}}
@keyframes md-orbit{0%{transform:translate(3px,0)}12.5%{transform:translate(2px,2px)}25%{transform:translate(0,3px)}37.5%{transform:translate(-2px,2px)}50%{transform:translate(-3px,0)}62.5%{transform:translate(-2px,-2px)}75%{transform:translate(0,-3px)}87.5%{transform:translate(2px,-2px)}}
.md-sadblink{opacity:0;animation:md-sadblink 4s steps(1) infinite}
@keyframes md-sadblink{0%{opacity:0}88%{opacity:1}97%{opacity:0}}
@media (prefers-reduced-motion:reduce){.md-sadblink{animation:none}}
.md-ponder{transform:translate(3px,-1px);animation:md-ponder 4s steps(1) infinite}
.md-puzzle{transform:translate(2px,0);animation:md-puzzle 3s steps(1) infinite}
@keyframes md-ponder{0%{transform:translate(3px,-1px)}45%{transform:translate(0,-1px)}50%{transform:translate(-3px,-1px)}95%{transform:translate(0,-1px)}}
@keyframes md-puzzle{0%{transform:translate(4px,0)}40%{transform:translate(-4px,0)}80%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.md-look,.md-blink,.md-dot,.md-flash,.md-sus,.md-orbit,.md-sway,.md-ponder,.md-puzzle{animation:none}}
.md-peek{opacity:0;animation:md-peek 9s steps(1) infinite}
.md-doze{animation:md-doze 9s steps(1) infinite}
.md-peeklook{animation:md-peeklook 9s steps(1) infinite}
@keyframes md-peek{0%{opacity:0}60%{opacity:1}90%{opacity:0}}
@keyframes md-doze{0%{opacity:1}60%{opacity:0}90%{opacity:1}}
@keyframes md-peeklook{0%{transform:translate(-4px,0)}70%{transform:translate(4px,0)}80%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.md-peek,.md-doze{animation:none}}
@keyframes md-up2{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes md-up1{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes md-z1{0%{opacity:1}66%{opacity:0}}
@keyframes md-z2{0%{opacity:0}33%{opacity:1}}
@keyframes md-tear{from{transform:translateY(0);opacity:1}to{transform:translateY(6px);opacity:0}}
