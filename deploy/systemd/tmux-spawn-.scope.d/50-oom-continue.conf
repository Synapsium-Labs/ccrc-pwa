# D-5241 (spec 2026-10-16 §5.10): a PREFIX drop-in — systemd applies a
# directory named `tmux-spawn-.scope.d` (the trailing hyphen is the prefix
# form) to every `tmux-spawn-<uuid>.scope`, the transient scope each ccd pane
# runs in. Under the user manager's default `OOMPolicy=stop`, one OOM kill of
# any process in a pane (a test run that outgrew memory) makes systemd stop
# the whole scope, and the session with it. With `continue` only the killed
# process dies; the session stays and sees its tool fail. Measured on throwaway
# scopes 2026-10-17 (plan Task 13): a new scope reads `continue`, a
# `daemon-reload` reaches running ones, and a child's OOM kill leaves the scope
# active. Rollback: remove this file and `systemctl --user daemon-reload` (an
# older release's installer does not know it, so it never deletes it).
[Scope]
OOMPolicy=continue
