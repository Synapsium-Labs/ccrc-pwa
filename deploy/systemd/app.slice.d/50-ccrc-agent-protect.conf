# The agent's protection chain, user-manager half (#1170). Under the kernel's
# memory_recursiveprot a cgroup's effective memory.min and memory.low are
# capped by its parent's, so ccrc-agent.service's own MemoryMin protected
# nothing while app.slice (and every ancestor above it) declared 0: under a
# thrash the agent refaulted its own node text in D-state and stopped
# accepting. Every ancestor from user.slice down declares at least the agent's
# MemoryMin and MemoryLow (ccrc-agent.service.d/protect.conf); the ones above
# user@<uid>.service are root-owned (deploy/systemd-root/), and
# deploy/assert-protect-chain.sh reports them until they are in place.
#
# Explicit protection is claimed by the children that declare it, so the
# sessions under this slice receive only what the agent leaves unclaimed. No
# MemoryHigh here, ever (#72, #84).
[Slice]
MemoryMin=512M
MemoryLow=768M
