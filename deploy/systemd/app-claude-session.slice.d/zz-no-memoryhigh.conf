# Sorts LAST among app-claude\x2dsession.slice's drop-ins, so it overrides
# MemoryHigh from limits.conf and from runtime `systemctl set-property` drop-ins
# (50-MemoryHigh.conf). An aggregate MemoryHigh throttles EVERY allocation in the
# slice; on 2026-09-09 and three times on 2026-09-10 that froze the whole fleet
# (99% sys, load 177, memory.events oom_kill 0) — stale-branch deploys kept
# reinstalling MemoryHigh=20G in limits.conf. Per-pane soft caps stay in
# ccd-cap-scopes; at slice level only the hard MemoryMax may bite.
[Slice]
MemoryHigh=infinity
