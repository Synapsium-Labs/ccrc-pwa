# Added 2026-07-28. Aggregate ceiling for ALL ccd sessions so N sessions cannot
# sum past the box (9 x 10G per-session max would be 90G on a 30G host).
# Leaves ~6G for the control plane (ccrc-agent) and system services.
#
# 2026-09-09 — MemoryHigh REMOVED at this level; only MemoryMax remains.
# MemoryHigh on an aggregate cgroup kills nothing: when the slice crosses it
# the kernel throttles EVERY allocation in the slice with synchronous reclaim.
# On 2026-09-09 ~8 GB of orphaned vitest workers took the slice to 20.5G
# against this 20G line. Result: 99% system time, load 107, memory PSI
# full=99%, ~6,400 throttle events/s, and memory.events `oom_kill 0` — the
# whole fleet frozen with nothing killed and nothing logged. The same
# directive had already been removed from user@1000 on 2026-08-14 for the
# same reason (memory.conf.bak-herdfix); this file was the copy one level
# down. With only MemoryMax, an unreclaimable aggregate overshoot invokes the
# cgroup-local OOM killer instead; Linux's OOM-badness policy chooses the
# victim, not this config. Graceful per-pane slowdown still comes from the
# per-scope MemoryHigh=8G that ccd-cap-scopes applies.
[Slice]
MemoryHigh=infinity
MemoryMax=24G
MemorySwapMax=6G
