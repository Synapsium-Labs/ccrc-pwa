# D-5241 (spec 2026-10-16 §5.10): the scope the tmux SERVER runs in. Under the
# user manager's default `OOMPolicy=stop`, one OOM kill inside it made systemd
# stop the scope and with it every pane on the box (the fleet outage of
# 2026-10-12, which a hand-placed drop-in like this one ended). With
# `continue` only the killed process dies. Shipped here so every `ccrc update`
# and a rebuilt box carry it. Rollback: remove this file and
# `systemctl --user daemon-reload` (an older release's installer does not know
# it, so it never deletes it).
[Scope]
OOMPolicy=continue
