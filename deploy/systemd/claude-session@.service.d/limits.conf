# Added 2026-07-28. NOTE ON SCOPE: this unit holds only the ccd supervise loop
# (~1 MB, 2 pids) - the real workload (claude + everything it spawns) lives in a
# per-pane transient tmux-spawn-<uuid>.scope created by tmux itself (Ubuntu tmux
# is built with systemd support), directly under user@1000.service and NOT under
# this unit. Those scopes are capped by the ccd-cap-scopes.timer enforcer, which
# is the guardrail that actually contains a runaway. These limits are only a
# backstop in case ccd ever runs claude in-unit.
[Service]
MemoryHigh=6G
MemoryMax=10G
MemorySwapMax=2G
TasksMax=4096
CPUWeight=100
