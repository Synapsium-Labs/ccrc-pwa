# Control-plane protection: during the 2026-07-28 thrash the agent stayed
# "active running" but could not answer, so the PWA hung on skeletons.
# Reserve memory against reclaim and win CPU against session siblings.
#
# #1170: the reservation protected nothing while the agent's ancestors
# declared none (memory_recursiveprot caps a child's effective protection by
# its parent's), so a later thrash still refaulted the agent's own node text
# and libraries in D-state. The ancestors now declare at least these values
# (app.slice.d here, deploy/systemd-root/ for the root-owned ones), and
# deploy/assert-protect-chain.sh fails the deploy when they do not.
#
# MemoryMin is sized from the agent's working set, anon plus the file pages it
# maps (about 233M anon measured), never from memory.current, which page cache
# inflates past 2G. MemorySwapMax=0 keeps that anon resident, IOWeight=1000
# puts its refaults ahead of the sessions' I/O. OOMScoreAdjust stays at the
# user manager's inherited value: a user manager can only raise it, and
# lowering it on user@<uid>.service would lower every session's too.
[Service]
MemoryMin=512M
MemoryLow=768M
MemorySwapMax=0
IOWeight=1000
CPUWeight=5000
