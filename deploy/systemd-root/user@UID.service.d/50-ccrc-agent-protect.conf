# The agent's protection chain, root-owned half (#1170). Under the kernel's
# memory_recursiveprot a cgroup's effective memory.min and memory.low are
# capped by its parent's, so ccrc-agent.service's MemoryMin holds only when
# every ancestor declares at least as much. A user manager cannot write the
# units above its own app.slice; this file is placed by the operator, as root,
# with the step deploy/assert-protect-chain.sh prints (UID in the directory
# name is the fleet user's numeric uid). No MemoryHigh here, ever (#72, #84).
[Service]
MemoryMin=512M
MemoryLow=768M
