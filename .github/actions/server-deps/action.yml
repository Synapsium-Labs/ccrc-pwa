# Everything a server test file needs before it can run, on either platform.
# ONE definition because every server job — each Linux shard, each trace
# shard, each macOS shard — can receive ANY server test file (design
# 2026-09-23 §10), so each must install what the whole suite needs. Before
# this action the list lived in two hand-kept copies (the `test` matrix's
# server leg and `test-macos`), and a dependency added to one was a red on
# the other.
#
# setup-node is NOT in here: it stays in each job, beside the comment that
# says which suite pins its node-version (see ci.yml's `server-shard`).
#
# INSTALLED ONCE PER RUN, NOT ONCE PER JOB (D-6770). On Linux the four
# installed trees (server, agent, pwa, ui) and the apt packages are restored
# from the Actions cache, read-only, and only a MISS installs them the old
# way (apt-get, then npm ci in each package). The key names the lockfile
# hashes, the runner image and the node version and nothing else — never a
# branch, a ref or a run — so a restored tree is the one `npm ci` gives for
# that lockfile on that image. ci.yml's `deps` job is the only caller that
# passes `save: 'true'`: it installs on a miss and writes the cache, and every
# other job restores what it wrote. macOS installs as before (the trees hold
# platform binaries, and no Linux job can write them).
name: server-deps
description: System packages plus npm ci in server/, agent/, pwa/ and ui/ — what any server test file may need — restored from the run's cache on Linux.

inputs:
  platform:
    description: linux or macos
    required: true
  save:
    description: "'true' writes the cache after installing on a miss (only ci.yml's deps job)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Refuse an unknown platform
      if: inputs.platform != 'linux' && inputs.platform != 'macos'
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        echo "server-deps: platform must be linux or macos, got '$PLATFORM'" >&2
        exit 1

    # tmux, git and jq are real dependencies of the server suite: the ccd and
    # statusline tests execute the real bash scripts against fixture HOMEs.
    # They are contained, never reaching a real tmux server or a real remote,
    # but the binaries must exist. jq ships in the ubuntu-latest image today
    # and is named here anyway — `statusline-command.sh` degrades to a bare
    # `claude-code` line WITHOUT it, which is a pass for some assertions and
    # a silent hole for the ones that matter.
    #
    # strace, on EVERY Linux server job and not only the trace shards: the
    # trace runner's own suite (server/test/ci-trace-run.test.ts) runs the
    # real strace, and any shard may be handed that file. python3 is in the
    # image already and named for the same reason as jq — the `ccgpt-*`
    # suites assert it is present whenever `CI` is set.
    # The key. Lockfile hashes, runner image (name and exact version), arch
    # and the node setup-node resolved — nothing that varies with a branch.
    - name: Name the cache entries (linux)
      id: key
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        lock="$(cat server/package-lock.json agent/package-lock.json pwa/package-lock.json ui/package-lock.json | sha256sum | cut -c1-40)"
        base="$RUNNER_OS-$RUNNER_ARCH-${ImageOS:-none}-${ImageVersion:-none}"
        echo "trees=ccrc-deps-v1-$base-$(node --version)-$lock" >> "$GITHUB_OUTPUT"
        echo "apt=ccrc-apt-v1-$base-$(sha256sum .github/actions/server-deps/action.yml | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore the installed trees (linux)
      id: trees
      if: inputs.platform == 'linux'
      uses: actions/cache/restore@v4
      with:
        path: |
          server/node_modules
          agent/node_modules
          pwa/node_modules
          ui/node_modules
        key: ${{ steps.key.outputs.trees }}

    - name: Restore the system packages (linux)
      id: debs
      if: inputs.platform == 'linux'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccrc-debs
        key: ${{ steps.key.outputs.apt }}

    # The hit arm installs the downloaded packages with dpkg and no
    # `apt-get update`; if that fails for any reason the miss arm runs, so the
    # cache can only ever save time.
    - name: Install system dependencies (linux)
      id: apt
      if: inputs.platform == 'linux'
      shell: bash
      env:
        HIT: ${{ steps.debs.outputs.cache-hit }}
      run: |
        if [ "$HIT" = true ] && sudo dpkg -i --skip-same-version "$RUNNER_TEMP"/ccrc-debs/*.deb; then
          exit 0
        fi
        sudo apt-get update && sudo apt-get install -y tmux jq strace python3
        mkdir -p "$RUNNER_TEMP/ccrc-debs"
        cp /var/cache/apt/archives/*.deb "$RUNNER_TEMP/ccrc-debs/" 2>/dev/null || true
        if compgen -G "$RUNNER_TEMP/ccrc-debs/*.deb" > /dev/null; then echo "have=true" >> "$GITHUB_OUTPUT"; fi

    - name: Keep the system packages (linux)
      if: inputs.platform == 'linux' && inputs.save == 'true' && steps.debs.outputs.cache-hit != 'true' && steps.apt.outputs.have == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ccrc-debs
        key: ${{ steps.key.outputs.apt }}

    # bash ≥ 4.2 (macOS ships 3.2 as /bin/bash; ccd's shebang is `env
    # bash`, so PATH decides and Homebrew's 5.x wins), tmux (the
    # substrate), flock (three call sites die by name without it), jq
    # (statusline-command.sh silently degrades without it).
    #
    # coreutils is g-PREFIXED (gtimeout, gsha256sum, …) and no gnubin ever
    # joins PATH, so the BSD userland stays honest: bare `timeout`,
    # `sha256sum`, `stat -c` are still absent and every Darwin arm still
    # runs. What coreutils buys is `gtimeout` — `_plat_timeout`'s own
    # documented Darwin fallback — without which the shim degrades to NO
    # deadline and every wedge-shaped fixture (a tmux that never answers,
    # a stall-budget probe) hangs to the test clock instead of being cut:
    # the first leg run measured exactly that, 40 tests shed at 20s.
    - name: Install system dependencies (macos)
      if: inputs.platform == 'macos'
      shell: bash
      run: brew install bash tmux flock jq coreutils

    - name: Install server
      if: steps.trees.outputs.cache-hit != 'true'
      shell: bash
      working-directory: server
      run: npm ci

    # server/test/typecheck-tests.test.ts spawns tsc against agent/'s own
    # tests-inclusive project too (`agentRoot` resolved two levels up) — a
    # deliberate cross-package check, so it needs agent/node_modules present
    # even though the job under test is the server's.
    - name: Install agent dependencies (needed by server's cross-package typecheck test)
      if: steps.trees.outputs.cache-hit != 'true'
      shell: bash
      working-directory: agent
      run: npm ci

    # Same cross-package need, for pwa: typecheck-tests.test.ts also spawns
    # tsc against `pwa/tsconfig.json` (pwaRoot, resolved the same way as
    # agentRoot) to close the "pwa's own `vitest run` never asks tsc
    # anything" gap. Without pwa/node_modules here, that spawn fails on
    # unresolvable imports (react, zustand, vite/client, …) — a dependency
    # error, not a type error — and the assertion would report pwa "has
    # type errors" for the wrong reason.
    - name: Install pwa dependencies (needed by server's cross-package typecheck test)
      if: steps.trees.outputs.cache-hit != 'true'
      shell: bash
      working-directory: pwa
      run: npm ci

    # AND ui, because installing pwa is not enough. pwa consumes @ccrc/ui as
    # SOURCE (`exports['.']` points at `src/index.ts`), so the tsc spawned
    # against pwa/tsconfig.json reads `../ui/src/**` — and Node resolves a
    # bare specifier from the IMPORTING file's directory, walking up from
    # `ui/src/primitives/` to `ui/` and never into `pwa/node_modules`.
    # Without this, every ui file reports "Cannot find module 'react'" and
    # the assertion blames pwa for type errors it does not have: precisely
    # the wrong-reason failure the step above was written to prevent, one
    # package further out. Measured on PR #346, which went red here while a
    # developer box stayed green — because `ui/node_modules` already existed
    # there.
    - name: Install ui dependencies (pwa consumes @ccrc/ui as source)
      if: steps.trees.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ui
      run: npm ci

    - name: Keep the installed trees (linux)
      if: inputs.platform == 'linux' && inputs.save == 'true' && steps.trees.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          server/node_modules
          agent/node_modules
          pwa/node_modules
          ui/node_modules
        key: ${{ steps.key.outputs.trees }}
