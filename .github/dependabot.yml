# Dependency updates for a repo that has no root package.json.
#
# The layout is the whole reason this file is not the two-line default:
# `server/`, `agent/`, `pwa/` and `ui/` each carry their OWN package-lock.json
# and are installed independently (`cd server && npm ci`), so Dependabot needs
# one `directory` per package. Point it at `/` alone and it finds nothing and says
# nothing — a silent no-op that looks exactly like "no updates available".
#
# `shared/` is deliberately ABSENT. It has a package.json but no lockfile and no
# dependencies: the file exists solely to tell tsc's NodeNext resolver that
# shared/*.ts is ESM (see the `//` key in shared/package.json). Listing it here
# would be an entry that can never produce an update.
#
# One group per package, ALL update types: `main` requires an approving review,
# so an ungrouped week could put a dozen PRs in front of a human. Each package's
# group takes major, minor and patch together, so a week produces at most one
# PR per package. Majors ride in the group too: dependencies stay on the latest
# major continuously, because holding majors back as separate PRs is how a repo
# falls behind. The group's CI run is the gate; a major that breaks it is fixed
# in that PR (or ignored here with a reason), not left to age.
#
# Two exceptions, both as `ignore` entries:
# - typescript-api (server) is the test scanners' parser, an exact pin
#   (D-5853): a new version is a reviewed PR that edits it, never a grouped bump.
# - @types/node never goes above the runtime major. Every package declares
#   engines `node >=22.16.0`, so @types/node stays on 22.x; typing against a
#   newer Node would let code use APIs the supported runtime lacks. Raise the
#   `versions` bound below together with the engines field, never before it.
version: 2

updates:
  # ── the three runnable packages ───────────────────────────────────────────
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript-api
      - dependency-name: '@types/node'
        versions: ['>=23']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      server-all:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: npm
    directory: /agent
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=23']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      agent-all:
        patterns: ['*']
        update-types: [major, minor, patch]

  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=23']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      pwa-all:
        patterns: ['*']
        update-types: [major, minor, patch]

  # ui/ (@ccrc/ui, the design system) is not runnable on its own, but it has
  # its own lockfile and pwa builds it from SOURCE — ui's dependencies resolve
  # from ui/node_modules, so they are bundled into the PWA and age like pwa's.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=23']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      ui-all:
        patterns: ['*']
        update-types: [major, minor, patch]

  # ── the actions the workflows pin ─────────────────────────────────────────
  #
  # The workflows pin each action by major tag (now actions/checkout@v7,
  # actions/setup-node@v7, actions/upload-artifact@v7 and
  # actions/download-artifact@v8), which floats within that major but never
  # crosses to the next — so without this
  # entry the pins age silently until a deprecation notice turns a green leg
  # red. `/` is correct here regardless of the package layout: this ecosystem
  # reads .github/workflows, not a manifest.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(actions)
    groups:
      actions:
        patterns: ['*']
