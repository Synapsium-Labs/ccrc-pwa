# A push to `stable` promotes the release already cut for its HEAD (design
# 2026-09-20 §4, decision 3). Thin: deploy/release-stable.sh owns the tag
# lookup, the two flag flips and the read-back, and is tested locally
# (server/test/release-stable.test.ts). No build step — nothing here can
# produce bytes; the gate runs one dependency-free module with the runner's
# own node, and it only reads the API. The branch's ruleset (no force push,
# no deletion; D-3130) keeps it fast-forward; the script refuses an untagged
# merge HEAD.
#
# GATED ON THE FULL SUITE (design 2026-09-23 §8). Pull requests run only the
# server tests their change can affect, so a promotion is where a selector
# miss must be caught. `gate` asks whether the pushed commit already carries
# a green `full-suite` from a run that tested this commit's own tree — the
# daily full run, a manual full run, or an earlier gate; if not, `full` runs
# ci.yml in full mode, and `promote` runs only on one of those two answers.
# The gate is here and not in the branch's ruleset because a ruleset's
# required check refuses the daily run's evidence (GitHub counts only a few
# events toward one, and the daily and manual runs are not among them). The
# cost, accepted: the branch moves before the gate answers, so a red gate
# leaves `stable` pointing past the newest promoted release with no flag
# flipped — `ccrc rollout` follows the flags, not the branch, so it moves
# nothing, and the next promotion fast-forwards past it.
name: release-stable

on:
  push:
    branches: [stable]

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Checks out the module that judges the evidence, and reads the pushed
    # commit's workflow runs and their jobs; nothing else.
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      # Evidence is a RUN that spec §8 names, of THIS commit, carrying a
      # green full-suite job: ci.yml's daily or manual full run on main, or
      # an earlier gate's called run on stable (its job is `full /
      # full-suite`). Never a pull-request run — its checks sit on the head
      # sha, but it tested the merge ref, another tree (final review FR-1).
      # main-artifact.mjs decides which runs count (unit-tested); ci.yml's
      # daily skip asks the same question. The runner's default shell is
      # `bash -e`: a CLI that fails (an API error, a malformed answer) fails
      # this job, and so does one that answers nothing — and a failed gate
      # promotes nothing.
      - name: Look for a green full-suite on this commit
        id: look
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
        run: |
          node .github/ci/main-artifact.mjs green-full-suite --repo "$REPO" --repo-id "$REPO_ID" --sha "$SHA" >> "$GITHUB_OUTPUT"
          case "$(cat "$GITHUB_OUTPUT")" in
            found=true) echo "full-suite is already green on $SHA — promoting without a second run" ;;
            found=false) echo "no green full-suite on $SHA — running the full suite first" ;;
            *) echo "::error::green-full-suite gave no answer for $SHA"; exit 1 ;;
          esac

  # A job that calls another workflow cannot declare timeout-minutes; the
  # called ci.yml's own jobs carry their deadlines. Its permissions are the
  # ceiling for every job in the called run, so they are what ci.yml's jobs
  # ask for — read access to Actions included, which select needs to find
  # the newest trusted map and durations (main-artifact.mjs); a called job
  # asking for more than this grants fails the run before it starts.
  full:
    needs: gate
    if: needs.gate.outputs.found == 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      mode: full

  promote:
    needs: [gate, full]
    # `always()` because `full` is skipped whenever the gate found a green
    # check, and a skipped need would otherwise skip this job too. The result
    # checks are then the whole gate: the called run's `verdict` output is
    # read, not only its result, because a called run in which `full-suite`
    # never ran is a successful run that proved nothing.
    if: always() && needs.gate.result == 'success' && (needs.gate.outputs.found == 'true' || (needs.full.result == 'success' && needs.full.outputs.verdict == 'green'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The script's own `gh` call edits the release's flags; nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The script names the release by `git tag --points-at HEAD`; the
          # tag must be present, not a shallow single-commit fetch.
          fetch-depth: 0

      - name: Promote the release tagged at HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/release-stable.sh
