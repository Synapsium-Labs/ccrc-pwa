# The release pipeline's delivery layer for a HAND-CUT tag, kept THIN by
# design (stage 4 spec §2): everything a release artifact promises — the
# refusals, the layout, the MANIFEST, the checksums — is promised by
# deploy/build-release.sh, which runs and is TESTED locally
# (server/test/build-release.test.ts). This file gives the script a clean
# tagged checkout, attests what it built, and hands the output to a GitHub
# Release. The pins in build-release.test.ts hold it to that.
#
# TWO JOBS, as in release-main.yml (D-6647, D-6653). `build` runs the
# builder, which installs and builds every package, so its token can only
# read, its checkout keeps no credential and it cannot mint the OIDC token
# that is the signing identity; it records the tarball's digest and uploads
# the tarball and SHA256SUMS. `publish` installs nothing and never opens the
# tarball: it checks the downloaded files against the recorded digest, then
# attests, names the bundle, writes the notes and publishes. The boundary
# between the two jobs is held by server/test/release-job-boundary.test.ts.
#
# Design 2026-09-20 §4: the attest step's identity here is
# …/release.yml@refs/tags/<tag> — `on: push: tags` makes the OIDC ref the
# tag, never main — the second of the two identities `ccrc update` accepts;
# and the release is born a PRERELEASE (decision 2): every release enters
# on `dev`, and `stable` is a promotion (deploy/release-stable.sh).
name: release

on:
  push:
    tags: ['v*']

jobs:
  # THE BUILD JOB runs the builder, and with it every install script and build
  # step the dependencies bring, so it holds contents: read and nothing else.
  # It has no write token and no id-token, so no code it runs can publish or
  # sign, and its checkout sets persist-credentials: false, so the checkout
  # leaves no credential behind for that code to find (the job's own read
  # token remains): at this checkout major the token is written to a file
  # under the runner's temp directory for the checkout's own fetch, and the
  # checkout removes that file in the step's own cleanup; a failed removal
  # does not fail the step, the action only warns or says nothing, as at v4.
  build:
    runs-on: ubuntu-latest
    # 30: the build is most of the run.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full depth: build-release.sh names the artifact by `git tag
          # --points-at HEAD` and refuses an untagged HEAD — the tag ref must
          # actually be present, not a shallow single-commit fetch.
          fetch-depth: 0
          persist-credentials: false

      # Its npm cache is restored into this job only, which holds no write
      # token (D-6652).
      - uses: actions/setup-node@v7
        with:
          # The newest Node satisfying the engines range in server/package.json; the floor
          # itself is declared in the three package.json files and pinned by node-floor.test.ts.
          node-version-file: server/package.json
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
            ui/package-lock.json

      # The script owns the build: refuses dirty/untagged (CI never passes
      # --untagged), installs and builds each package itself, assembles
      # ccrc-<tag>.tar.gz + SHA256SUMS under --out.
      - name: Build the release artifact
        run: bash deploy/build-release.sh --out release-out

      # Refuses a tarball not named after this run's tag (D-3127's case, a
      # HEAD carrying a second release-shaped tag, now caught before the
      # hand-over), a SHA256SUMS that is not its one line, and a build.json
      # naming another tag or commit; then hands the tarball's digest to the
      # publish job as a job output (D-6650, D-6653).
      - name: Record the release files' digest
        id: record
        run: bash deploy/release-artifact.sh record --tag "$GITHUB_REF_NAME" --dir release-out

      # The hand-over (D-6657): one artifact named for the tag, holding exactly
      # the tarball and its SHA256SUMS, kept seven days so a failed publish job
      # can be re-run alone. Stored as it is: the tarball is compressed already.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            release-out/ccrc-${{ github.ref_name }}.tar.gz
            release-out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # THE PUBLISH JOB holds the write token and the OIDC permission, and runs none
  # of the build's code. contents: write — the release the last step creates.
  # id-token: write and attestations: write — the permission set
  # `actions/attest`'s README documents for this exact no-registry-push usage;
  # `attest-build-provenance@v4` itself is a thin wrapper whose own README
  # documents no permissions or inputs, only a redirect to `actions/attest`
  # (D-3126). The OIDC token is the signing identity, no key kept. It installs
  # nothing and has no setup-node: the notes step runs a dependency-free module
  # on the runner's own node (D-6651). Its checkout keeps no credential, since
  # nothing here pushes and the publish step uses GH_TOKEN (D-6653). There is
  # no release decision: it runs whenever the build job succeeds.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # 10: it downloads, checks, attests and publishes; it builds nothing.
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full depth: the notes are what changed since the previous release
          # tag, read from git.
          fetch-depth: 0
          persist-credentials: false

      # Into the runner's temp directory, outside the checkout (D-6657). The
      # path alone keeps nothing off this job's scripts: what does is the
      # extractor. This major keeps v7's (unzip-stream 0.3.4), which
      # confines every zip entry under release-in, where @v4 to @v6 wrote an
      # `x/../../..` entry outside it. An artifact that is not a zip is
      # written raw, as one file into release-in, named by the basename of
      # the blob's download filename, which whoever wrote the blob chooses,
      # not by the artifact's name. Either way, verify refuses anything but
      # the two expected files (D-6726, D-6739). This major also fails a
      # digest mismatch, but against the digest the upload recorded, which
      # the build job controls: it proves the transfer, not the build. The
      # build's digest this job trusts is the one verify checks.
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-in

      # The artifact must be exactly the two regular files, hash to the digest
      # the build job recorded and carry exactly that SHA256SUMS line; only
      # then are they written into release-out/. It never opens the tarball
      # (D-6650, D-6653).
      - name: Check the build's artifact against its recorded digest
        env:
          CCRC_BUILD_DIGEST: ${{ needs.build.outputs.digest }}
        run: bash deploy/release-artifact.sh verify --tag "$GITHUB_REF_NAME" --digest "$CCRC_BUILD_DIGEST" --in "$RUNNER_TEMP/release-in" --out release-out

      # Keyless provenance over the verified tarball, signed by this
      # workflow's identity at the pushed tag.
      - uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-path: release-out/ccrc-*.tar.gz

      # The bundle rides the release under the one name every `ccrc update`
      # fetches (`<tarball>.sigstore.json`), so the publish glob carries it —
      # but only once the tag, the tarball and the bundle all agree (D-3127).
      # build-release.sh names the tarball from `git tag --points-at HEAD`,
      # independently of $GITHUB_REF_NAME; a HEAD carrying a second
      # release-shaped tag (a hand-cut v0.1.0 landing on a commit
      # release-main already auto-tagged v0.0.9) would otherwise let this
      # step copy the bundle to a name no tarball in release-out/ matches.
      # build-release.sh itself is untouched by this wave, so the refusal
      # lives here, beside the copy it protects: no tarball named after this
      # run's tag means refuse rather than publish a mismatched release. The
      # refusal leaves a tag with no release — re-runnable after the
      # operator removes the extra tag — the same shape as any other failed
      # release.yml run.
      # The check is now defence in depth. `record` in the build job refuses a
      # tarball named for another tag, and `verify` writes exactly
      # `ccrc-$GITHUB_REF_NAME.tar.gz` or nothing, so this refusal should not
      # fire; it stays, beside the copy it protects, in case either is loosened.
      - name: Name the provenance bundle
        env:
          CCRC_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          [ -f "release-out/ccrc-$GITHUB_REF_NAME.tar.gz" ] || { echo "release.yml: the build named its artifact after another release tag at HEAD (this commit carries more than one); refusing to publish $GITHUB_REF_NAME — delete the extra tag, or cut the minor on a commit release-main did not auto-tag" >&2; exit 1; }
          cp -- "$CCRC_BUNDLE_PATH" "release-out/ccrc-$GITHUB_REF_NAME.tar.gz.sigstore.json"

      # The body (D-5548): what changed since the previous release tag,
      # written by the script from git — commit text goes from git to the file
      # and from the file to gh, never through a run: line or an expression.
      # Outside release-out/, so the publish glob never ships it as an asset.
      # A writer that fails costs the release its body, never the release.
      - name: Write the release notes
        run: |
          node deploy/release-notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/release-notes.txt" || { echo "::warning::release.yml: could not write the release notes for $GITHUB_REF_NAME; publishing with an empty body"; : > "$RUNNER_TEMP/release-notes.txt"; }

      # All three artifacts ride the glob. --verify-tag: the release is cut
      # only for a tag that exists on the remote. --prerelease: born on dev.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-out/* --verify-tag --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
