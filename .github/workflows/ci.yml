# The monorepo had no CI at all — these suites have only ever been run by hand,
# which is how an installed ccd sat 4,258 lines behind main without anyone
# noticing. This is the mechanism that keeps the extraction honest after the
# day it lands.
#
# ONE pipeline, several MODES (design 2026-09-23 §3). The trigger decides the
# mode, the `select` job computes what that mode runs, and every other job
# reads select's outputs:
#   pull_request        selected — the LIGHT run (operator ruling 2026-10-25):
#                       the server tests the change can affect (a measured
#                       dependency map, .github/ci/select-tests.mjs), sharded;
#                       the agent, pwa and browser TESTS only when the change
#                       can reach them (.github/ci/reach.mjs); every typecheck,
#                       the build and the static checks always. The `full-ci`
#                       label, or a change under .github/, makes it a full run.
#   merge_group         full     — the queue is where the whole suite runs
#                       (operator ruling 2026-10-25, replacing 2026-09-28's
#                       "what a pull request runs"): every server shard, the
#                       agent, pwa and browser tests, in a concurrency group
#                       of its own; no macOS leg and no full-suite.
#   schedule (hourly)   refresh  — re-trace the tests every merge since the
#                       last refresh affected and update the map. No test legs.
#                       Not a push trigger: a refresh per merge held 8-15 runner
#                       slots for 25-60 minutes and gated nothing (D-6769).
#   schedule (daily)    full     — every leg, macOS included, plus a traced
#                       rebuild of the map. Skipped when main's head already
#                       carries a green `full-suite`.
#   workflow_dispatch   full (default) or rebuild.
#   workflow_call       the mode the caller passes — release-stable.yml's
#                       gate runs `full` here before it promotes.
# While CCRC_SELECTION (below) says `shadow`, `selected` mode computes and
# reports its selection but still runs every server test.
name: ci

# Least privilege, stated rather than inherited (2026-08-23). The default for
# this repo already computes to read-only, and no job here needs to write —
# CI only reads the tree and the Actions API, and runs suites. Declaring it
# means a later job that DOES want write has to ask in the diff, where a
# reviewer sees it, instead of silently receiving whatever the org default
# happens to be that week. Especially worth fixing before the repo is public:
# `pull_request` (not `pull_request_target`) already gives a fork's run a
# read-only token and no secrets, and this keeps that true if the org default
# is ever loosened. Two jobs ask for more than this, each in its own
# `permissions:` block, and each for exactly `contents: read` plus
# `actions: read`: `select` (it lists and downloads the trusted main runs'
# map and durations, and on the daily run lists the workflow runs and jobs
# of main's head to find a green full-suite), and `map-build` (its check,
# just before a refresh publishes, that the map it was built on is still the
# newest trusted one). No job reads check runs, and none asks for any write.
permissions:
  contents: read

on:
  # `labeled` so that adding the `full-ci` label to an open pull request
  # re-runs it as a full run (a label alone starts no run otherwise).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # THE MERGE QUEUE (landing-order stage 2, spec §5.2). A queue runs the
  # REQUIRED checks on the group it built before it merges, and a workflow that
  # does not listen for `merge_group` never reports them — the entry waits out
  # the queue's timeout and is removed. This trigger is on `main` BEFORE the
  # operator turns the queue on (the spec's rollout step 1). A queue run runs
  # the full suite (the mode table above). There is no `push`
  # trigger, so the queue's own `gh-readonly-queue/main/*` branches start no
  # second run.
  merge_group:
  # Two schedules. The daily one is the full run; the hourly one is the map
  # refresh (D-6769). A refresh run is told apart by `github.event.schedule`
  # being exactly the hourly cron, in every predicate below, so the string
  # appears in each of them and server/test/ci-pipeline.test.ts pins that.
  schedule:
    - cron: '17 3 * * *'
    - cron: '23 * * * *'
  # Manual re-run for the day the webhooks don't come: during the 2026-08-06
  # Actions incident GitHub processed ~15% of webhooks, so pushes and PR
  # events silently created NO run. `gh workflow run ci.yml --ref <branch>`
  # starts one; it uses the workflow file from the ref it is dispatched on.
  # Whether its checks then satisfy a PR's required checks is NOT settled:
  # GitHub's "Troubleshooting required status checks" says checks from a
  # `workflow_dispatch` run do not satisfy a RULESET's required checks, and
  # `main` is guarded by classic branch protection, against which this has
  # never been tested. Treat it as the way to get the suites' answer, not as
  # a way to unblock a merge.
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: every leg, a verdict (no trace). rebuild: trace every server test and rebuild the map. refresh: re-trace what changed since the map and update it.'
        type: choice
        options: [full, rebuild, refresh]
        default: full
  workflow_call:
    inputs:
      mode:
        description: The mode to run; release-stable.yml passes full.
        type: string
        default: full
    outputs:
      verdict:
        description: "`green` iff this run's full-suite job ran and every leg it needs succeeded; empty otherwise."
        value: ${{ jobs.full-suite.outputs.verdict }}

# The switch that turns selection on (design 2026-09-23 §12 step 5). In
# `shadow`, `select` computes and reports everything, but the shards
# still run every server test; `enforce` makes a pull request run only what
# was selected. One line, defined once — server/test/ci-pipeline.test.ts.
env:
  CCRC_SELECTION: enforce

# Pull requests: one group per PR, and a newer push cancels the older run.
# Everything else never cancels, and each mode has its own group, so an hourly
# refresh can never cancel the daily run. The `refresh` group COALESCES: a
# running refresh is never cancelled, and GitHub keeps at most one pending run
# per group, replacing an older pending one with the newer, so the one that
# starts next covers every merge since the last (D-6769). `ci-` first because when
# release-stable.yml CALLS this file the group is evaluated in the caller's
# context, where `github.workflow` is `release-stable` — without the prefix the
# called run would wait on the caller's own group.
#
# A MERGE-QUEUE RUN gets a group of its OWN, `queue-<run id>` (landing-order
# stage 2, spec §5.2), taken before the shared `refresh` group can be reached.
# GitHub keeps at most one PENDING run per group and cancels the older pending
# one even with `cancel-in-progress: false`: a queue run in a shared group
# could lose its checks, and the queue would remove the entry. Nothing cancels
# one either — `cancel-in-progress` stays the pull_request event alone.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'merge_group' && format('queue-{0}', github.run_id) || (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh') && 'refresh' || format('{0}-{1}-{2}', inputs.mode || 'full', github.event_name, github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run runs (design 2026-09-23 §4.1, §6). Dependency-free Node, so
  # it runs before any `npm ci`. Every uncertainty — no map, an unreadable one,
  # a change under .github/ or to a lockfile, any internal error — answers
  # `full` with the reason; it never answers "nothing". If this job itself
  # dies, `test (server)` below goes red.
  select:
    name: select tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read — the map and the durations are artifacts of trusted
    # main runs, listed and downloaded here; and the daily run lists the
    # workflow runs and jobs of main's head to ask whether it already
    # carries a green `full-suite` before it spends an hour proving it again.
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      trace: ${{ steps.select.outputs.trace }}
      shadow: ${{ steps.select.outputs.shadow }}
      count: ${{ steps.select.outputs.count }}
      macos_count: ${{ steps.select.outputs.macos_count }}
      server_matrix: ${{ steps.select.outputs.server_matrix }}
      macos_matrix: ${{ steps.select.outputs.macos_matrix }}
      trace_matrix: ${{ steps.select.outputs.trace_matrix }}
      trace_count: ${{ steps.select.outputs.trace_count }}
      map_sha: ${{ steps.select.outputs.map_sha }}
      fallback: ${{ steps.select.outputs.fallback }}
      floor: ${{ steps.select.outputs.floor }}
    steps:
      # Full depth: the changed set is `git diff <map-sha> HEAD`, and the map's
      # commit must be present to be diffed against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # A pull request that changes the pipeline runs the full suite — decided
      # HERE, in plain bash, not by the selector the pull request may be
      # changing (select-tests.mjs's own `.github/` trigger is a second line).
      # A base it cannot diff against answers "changed": the safe direction.
      # A MERGE-QUEUE RUN asks the same question of the same change (operator
      # ruling 2026-09-28: it runs what a pull request runs), against the sha
      # the queue built its group on — it has no `github.base_ref` — so a pull
      # request that edits the selector cannot choose its own queue run's tests.
      - name: Does this pull request change the pipeline?
        id: pipeline
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: |
          if base=$(git merge-base "$BASE" HEAD) && changed=$(git diff --name-only "$base" HEAD -- .github/); then
            if [ -n "$changed" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              printf 'this pull request changes the pipeline:\n%s\n' "$changed"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::could not diff this change against $BASE; treating its pipeline as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # D-6771: does this pull request change what `node floor` runs or runs
      # on, other than through a file a test reads? Answered here, where the
      # diff is: the manifests and lockfiles, the Node version files, the
      # history library and the workflow, the floor's own tests and the
      # vitest config with its setup files. The Select step adds the other
      # half: the floor's tests the dependency map selects, which covers
      # every module and helper they import. Read by that job's leg switch —
      # a path filter on the trigger would skip a required check; this skips
      # only the one job that is not required. Every event but a pull request
      # answers true (a merge-queue group and the daily run check every merge
      # against the floor), and so does a base it cannot diff.
      - name: Does this pull request touch the node floor's inputs?
        id: floor
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ format('origin/{0}', github.base_ref) }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif mb=$(git merge-base "$BASE" HEAD) && changed=$(git diff --name-only "$mb" HEAD -- \
              ':(glob)**/package.json' ':(glob)**/package-lock.json' ':(glob)**/.nvmrc' \
              ':(glob)ccd/history/**' ':(glob).github/**' \
              server/test/node-floor.test.ts ':(glob)server/test/history-*.test.ts' server/test/measure-history.test.ts \
              server/vitest.config.ts server/vitest.select.config.ts \
              ':(glob)server/test/*.setup.mjs' ':(glob)server/test/*.globalsetup.mjs'); then
            if [ -n "$changed" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              printf 'the node floor runs; its inputs changed:\n%s\n' "$changed"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "the node floor is skipped; none of its inputs changed"
            fi
          else
            echo "::warning::could not diff this change against $BASE; running the node floor"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The newest map and duration table come ONLY from artifacts of trusted
      # ci.yml runs on main (main-artifact.mjs: branch main, this repository,
      # a push, schedule or dispatch) — never from the Actions cache, whose PR
      # scope a pull request can write. Nothing found, or a failed download,
      # means no map: a full run. The artifact id is kept for map-build's
      # check, just before it publishes, that this map is still the newest.
      # Every cache path is under the runner's temp directory, never the
      # checkout (final review FR-4): a pull request can commit a
      # `testmap.json` into the tree, gh's download refuses to overwrite an
      # existing file, and select would then read the planted map.
      - name: Fetch the newest trusted map and durations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-cache"
          for name in testmap testtimes; do
            out=$(GITHUB_OUTPUT='' node .github/ci/main-artifact.mjs --repo "$REPO" --repo-id "$REPO_ID" --name "$name")
            printf '%s\n' "$out"
            run_id=$(printf '%s\n' "$out" | sed -n 's/^run_id=//p')
            artifact_id=$(printf '%s\n' "$out" | sed -n 's/^artifact_id=//p')
            if [ -n "$run_id" ]; then
              if gh run download "$run_id" --repo "$REPO" -n "$name" -D "$RUNNER_TEMP/ci-cache"; then
                echo "$artifact_id" > "$RUNNER_TEMP/ci-cache/$name.artifact"
              else
                echo "::warning::could not download $name from run $run_id; going without it"
              fi
            fi
          done
      # The stable gate's question (release-stable.yml), asked by the same
      # module: a run spec §8 names — this workflow's daily or manual full
      # run on main, or an earlier gate — of THIS commit, with a green
      # full-suite job. Never a pull request's run: its checks sit on the
      # head sha, but it tested the merge ref (final review FR-1). Only
      # `found=true` skips the day; `found=false`, and ANY failure of the
      # CLI, answer "not green", which runs the suite — the safe direction.
      - name: Does this commit already carry a green full-suite?
        id: green
        if: github.event_name == 'schedule' && github.event.schedule != '23 * * * *'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
        run: |
          full_green=false
          if answer=$(node .github/ci/main-artifact.mjs green-full-suite --repo "$REPO" --repo-id "$REPO_ID" --sha "$SHA"); then
            if [ "$answer" = found=true ]; then full_green=true; fi
          else
            echo "::warning::could not read this commit's workflow runs; running the full suite rather than skipping it"
          fi
          echo "full_green=$full_green" >> "$GITHUB_OUTPUT"
      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          # The `full-ci` label asks a pull request for the full suite, as a change under .github/ does.
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          INPUT_MODE: ${{ inputs.mode || (github.event.schedule == '23 * * * *' && 'refresh') || '' }}
          FULL_GREEN: ${{ steps.green.outputs.full_green || 'false' }}
          PIPELINE_CHANGED: ${{ steps.pipeline.outputs.changed }}
          FLOOR: ${{ steps.floor.outputs.run }}
          BASE: ${{ format('origin/{0}', github.base_ref) }}
        run: |
          args=(--repo "$GITHUB_WORKSPACE" --event "$EVENT" --base "$BASE" --selection "$CCRC_SELECTION" --full-green "$FULL_GREEN" --map "$RUNNER_TEMP/ci-cache/testmap.json" --trace-list "$RUNNER_TEMP/ci-cache/traced.txt")
          if [ -n "$INPUT_MODE" ]; then args+=(--input-mode "$INPUT_MODE"); elif [ "$PIPELINE_CHANGED" = true ] || [ "$FULL_LABEL" = true ]; then args+=(--input-mode full); fi
          if [ -f "$RUNNER_TEMP/ci-cache/testtimes.json" ]; then args+=(--times "$RUNNER_TEMP/ci-cache/testtimes.json"); fi
          # D-6771: the files the node floor runs, read from its own job so the list has one source; select.mjs
          # answers `floor` true when its selection holds one of them, or when FLOOR (the static inputs) is true.
          sed -n '/^  node-floor:$/,/^  [a-z-]*:$/p' .github/workflows/ci.yml | sed -n 's/^ *\(test\/[A-Za-z0-9._-]*\.test\.ts\)$/\1/p' > "$RUNNER_TEMP/floor-list.txt"
          args+=(--floor-list "$RUNNER_TEMP/floor-list.txt" --floor-static "${FLOOR:-true}")
          node .github/ci/select.mjs "${args[@]}"
      # map-build refreshes against EXACTLY the map this job diffed from, not
      # whatever is newest by the time it runs, and is told which tests this
      # job MEANT to trace — a test whose trace never arrived is written
      # unknown instead of keeping its stale entry — and which artifact the
      # map was, for its check before it publishes. A build (a rebuild, or a
      # refresh that had no map) gets the fetched map too, if there was one:
      # only to tell a test that NEWLY fails under trace from one that already
      # did. traced.txt is always there, so the upload never finds nothing.
      - name: Hand the map to map-build
        if: steps.select.outputs.trace != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: select-inputs
          path: |
            ${{ runner.temp }}/ci-cache/testmap.json
            ${{ runner.temp }}/ci-cache/traced.txt
            ${{ runner.temp }}/ci-cache/testmap.artifact
          if-no-files-found: error
          retention-days: 3

  # THE ONE INSTALL OF THE RUN (D-6770). Every server shard, trace shard, pwa
  # shard, the pwa static checks and the Node-floor leg need the same four installed trees (server, agent, pwa,
  # ui) and the same apt packages, and each used to run its own `apt-get` and
  # four `npm ci`. This job installs them once per lockfile set and writes
  # them to the Actions cache; the jobs below `need` it and RESTORE the entry
  # read-only (./.github/actions/server-deps, whose header has the key). The
  # key is the lockfile hashes, the runner image and the node version, never a
  # branch, so a restored tree is what `npm ci` gives for that lockfile; a
  # miss installs the old way. One entry per node version: '22' for the
  # shards, the floor's own for `node-floor`. Not a required check, and the
  # jobs that need it run even when it fails (`!cancelled()`), falling back
  # to their own install, so it can only save time.
  deps:
    name: install dependencies (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # A cold install of the four packages measured about three minutes
    # (server-deps' old note on node-floor); 30 is a deadline, not an estimate.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The server shards' '22' and node-floor's exact floor; the latter is
        # pinned equal to `engines.node` by ci-pipeline.test.ts.
        node: ['22', '22.16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
            ui/package-lock.json
      - uses: ./.github/actions/server-deps
        with:
          platform: linux
          save: 'true'

  # The selected server tests, split across runners (design 2026-09-23 §7).
  # Skipped when nothing is selected — `test (server)` checks that the skip
  # was for that reason and no other.
  server-shard:
    name: server ${{ matrix.shard }}/${{ matrix.total }}
    needs: [select, deps]
    if: ${{ !cancelled() && needs.select.outputs.count != '0' && (needs.select.outputs.tests == 'selected' || needs.select.outputs.tests == 'full') }}
    runs-on: ubuntu-latest
    # A deadline, not the default. Without this key a wedged job runs for
    # GitHub's 360 minutes before anyone learns it wedged. Each shard is
    # packed to about four minutes, up to 12 shards (a longer file gets one of
    # its own), and the whole unsharded server leg measured 18.5 min at the
    # median (21.5 max, 2026-09-23) — so 30 is a deadline even for a shard
    # that received the entire suite. Pinned — key AND ceiling — by
    # server/test/oss-metadata.test.ts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.server_matrix) }}
    steps:
      # `fetch-depth: 0`, not the default 1, because topology-clean.test.ts
      # scans the commit RANGE this branch adds — not only the tip — and it
      # needs `origin/main` present to resolve a base. At depth 1 that ref does
      # not exist; the suite is written to go RED on a missing base rather than
      # quietly measure nothing, so removing this line breaks CI loudly instead
      # of disarming the history guard in silence.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Above the engines floor in server/agent/pwa package.json
          # (>=22.16.0: node:sqlite stopped needing --experimental-sqlite at
          # 22.13, and gained FTS5 and a gc-safe `.iterate()` at 22.16).
          # server/test/node-floor.test.ts runs FOUR assertions on whichever
          # server shard receives it, and they are not symmetric. (An edit to
          # this line is an edit under .github/, which always selects the full
          # suite — so node-floor always runs against a changed node-version.)
          # Assertion 2 is RELATIVE and ONE-DIRECTIONAL: it asserts THIS
          # interpreter satisfies the declared `engines.node`. It catches this
          # node-version being lowered below the floor; it does NOT catch the
          # floor itself being lowered to meet a low node-version — a floor at
          # or below whatever interpreter is running stays green on assertion 2
          # alone. Measured, not assumed: mirroring all three package.jsons to
          # `>=22.0.0` left assertions 1-2 green under a 24.x interpreter.
          # Assertions 3 and 4 are ABSOLUTE: they read no package.json at all.
          # 3 round-trips a DatabaseSync (the 22.13 boundary); 4 runs FTS5 and a
          # gc-pressured `.iterate()` in a child (the 22.16 boundary). With
          # engines lowered to 22.13, 22.15.1 keeps 1-3 green and only 4 reds
          # (measured). They catch BOTH sides — this node-version AND every
          # `engines.node` — being lowered together, the case assertion 2
          # cannot see; but '22' resolves the newest 22.x, far above the floor,
          # so on THIS leg they fire only if this string itself drops. The
          # `node-floor` job below runs the file on EXACTLY the floor's version,
          # and ci-pipeline.test.ts pins that job's string equal to
          # `engines.node`. This leg's '22' is pinned by nothing; the floor is
          # pinned by that job.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json

      - uses: ./.github/actions/server-deps
        with:
          platform: linux

      # Local binary, never npx: `npx vitest` resolves to a global cache copy
      # with no jsdom and falsely reports "no tests" alongside 39 errors.
      # Positional file arguments are SUBSTRING filters (`a.test.ts` also runs
      # `xa.test.ts`), so the shard's list goes through vitest.select.config.ts,
      # whose include is exactly the listed paths. The JSON report is the
      # per-file durations the daily run publishes for the next plan.
      - name: Test
        working-directory: server
        env:
          FILES: ${{ matrix.files }}
          VITEST_SHARD: ${{ matrix.vitest_shard }}
          WORKERS: ${{ matrix.workers }}
        run: |
          echo "$FILES" | tr ' ' '\n' > "$RUNNER_TEMP/tests.txt"
          CCRC_TEST_LIST="$RUNNER_TEMP/tests.txt" ./node_modules/.bin/vitest run --config vitest.select.config.ts ${VITEST_SHARD:+--shard=$VITEST_SHARD} --maxWorkers="$WORKERS" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/times.json"

      - name: Keep the durations
        if: always() && needs.select.outputs.tests == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: times-${{ matrix.shard }}
          path: ${{ runner.temp }}/times.json
          if-no-files-found: warn
          retention-days: 3

  server-typecheck:
    name: typecheck (server)
    needs: select
    if: needs.select.outputs.tests == 'selected' || needs.select.outputs.tests == 'full'
    runs-on: ubuntu-latest
    # tsc over server/src alone; about a minute. 15 carries a cold npm cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: ./node_modules/.bin/tsc --noEmit

  # THE REQUIRED `test (server)` CHECK (design 2026-09-23 §4.2). A summary,
  # because the server tests now run as a variable number of shards and a
  # required check needs one fixed name. `if: always()` because a job whose
  # `needs:` failed is SKIPPED, and GitHub reports a skipped job as SUCCESS
  # — written the obvious way, a crashed selector would be a green check.
  # verdict.mjs is red unless select succeeded, the typecheck succeeded, and
  # the shards succeeded or were skipped because select counted zero — and a
  # pull request that answered tests none is red too (EVENT, from the
  # workflow's own context). The first step reads the job results with no
  # script at all and can only ADD red: a no-op verdict.mjs cannot turn a
  # failed prerequisite green.
  server:
    name: test (server)
    needs: [select, server-shard, server-typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a prerequisite that did not succeed (no script involved)
        if: needs.select.result != 'success' || contains(fromJSON('["failure","cancelled"]'), needs.server-shard.result) || contains(fromJSON('["failure","cancelled"]'), needs.server-typecheck.result)
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verdict
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          TYPECHECK_RESULT: ${{ needs.server-typecheck.result }}
          SHARDS_RESULT: ${{ needs.server-shard.result }}
          TESTS: ${{ needs.select.outputs.tests }}
          COUNT: ${{ needs.select.outputs.count }}
          EVENT: ${{ github.event_name }}
        run: node .github/ci/verdict.mjs server

  # `test (agent)` — required BY NAME, so this matrix keeps its id, its axis
  # and its value, and carries no job-level `if:` or `needs:`: a skipped matrix
  # never expands, and the check would never appear (design 2026-09-23 §4.2).
  # On a refresh or a rebuild every STEP is skipped instead, which reports the
  # check green without running it. `test (pwa)` is no longer a leg of this
  # matrix: it is the aggregate `pwa` job below (D-6768). Not selected.
  test:
    runs-on: ubuntu-latest
    # A deadline, not the default. Without this key a wedged job runs for
    # GitHub's 360 minutes before anyone learns it wedged; the agent leg takes
    # about a minute (measured 2026-09-23), so 30 is a deadline with room for
    # a cold npm cache, not a guess at the real thing.
    # Pinned — key AND ceiling — by server/test/oss-metadata.test.ts.
    timeout-minutes: 30
    env:
      CCRC_LEG: ${{ (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild') && 'skip' || 'run' }}
    strategy:
      fail-fast: false
      matrix:
        package: [agent]
    steps:
      # Full depth, as when this matrix also carried the server leg (whose
      # topology-clean needs `origin/main` — see server-shard): unchanged, so
      # the agent suite meets the tree exactly as before.
      - uses: actions/checkout@v7
        if: env.CCRC_LEG == 'run'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: env.CCRC_LEG == 'run'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        if: env.CCRC_LEG == 'run'
        working-directory: ${{ matrix.package }}
        run: npm ci

      # Local binary, never npx: `npx vitest` resolves to a global cache copy
      # with no jsdom and falsely reports "no tests" alongside 39 errors.
      # The light pull-request rule (operator ruling 2026-10-25): the agent's
      # tests skip when the change cannot reach them. The Install and the
      # Typecheck below run either way, and so does this job, so
      # `test (agent)` reports on every run. Only a pull request ever skips.
      - name: Can this change reach the agent tests?
        id: reach
        if: env.CCRC_LEG == 'run' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: node .github/ci/reach.mjs --pkg agent --event pull_request --base "origin/$BASE_REF" --full-label "$FULL_LABEL"

      - name: Test
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        working-directory: ${{ matrix.package }}
        run: ./node_modules/.bin/vitest run

      - name: Typecheck
        if: env.CCRC_LEG == 'run'
        working-directory: ${{ matrix.package }}
        run: ./node_modules/.bin/tsc --noEmit

  # The pwa suite, split into three vitest shards (D-6768). The unsharded Test
  # step measured about 576 s of a 10.8 min job; `--shard=i/3` takes each shard
  # to about four minutes. No pwa times artifact exists (the published
  # durations cover the server suite), so the split is vitest's own file split,
  # not a packed one. The shards need `deps` but run whatever it did
  # (`!cancelled()`), and every step skips on a refresh or a rebuild: `pwa`
  # below is required by name and must always get a result to read.
  pwa-shard:
    name: pwa ${{ matrix.shard }}/${{ matrix.total }}
    # The run's one install (D-6770), restored read-only through server-deps
    # like the server shards; `!cancelled()` so a failed `deps` only costs the
    # shard its own install. `pwa` below still reads every shard's result.
    needs: deps
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A deadline, not the default: a shard is about four minutes plus install,
    # and the whole unsharded suite was under eleven. Pinned — key AND ceiling —
    # by server/test/oss-metadata.test.ts.
    timeout-minutes: 30
    env:
      CCRC_LEG: ${{ (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild') && 'skip' || 'run' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v7
        if: env.CCRC_LEG == 'run'
        with:
          fetch-depth: 0

      # The light pull-request rule (operator ruling 2026-10-25), see the agent leg:
      # only a pull request asks, and only the three shards' tests skip.
      - name: Can this change reach the pwa tests?
        id: reach
        if: env.CCRC_LEG == 'run' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: node .github/ci/reach.mjs --pkg pwa --event pull_request --base "origin/$BASE_REF" --full-label "$FULL_LABEL"

      # '22', as `deps` and the server shards: the trees' cache key names the
      # node version setup-node resolves, so another string would always miss.
      - uses: actions/setup-node@v7
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
            ui/package-lock.json

      # The run's one install (D-6770): pwa/ AND ui/ node_modules, restored
      # from the `deps` entry (a miss installs them here). BEFORE the suite, not
      # after it. pwa consumes @ccrc/ui as SOURCE, so `../ui/src/**` is resolved
      # from ITS OWN directory — Node and vite walk up from
      # `ui/src/primitives/`, reach `ui/`, and never look inside
      # `pwa/node_modules`. Without `ui/node_modules` present first, all 119
      # pwa suites fail at import with "Failed to resolve import
      # 'class-variance-authority'". Invisible on a developer box, where that
      # directory already exists; this ordering is the only thing that proves
      # it on a clean checkout.
      - uses: ./.github/actions/server-deps
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        with:
          platform: linux

      # Local binary, never npx: `npx vitest` resolves to a global cache copy
      # with no jsdom and falsely reports "no tests" alongside 39 errors.
      - name: Test
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        working-directory: pwa
        env:
          SCOPE: ${{ steps.reach.outputs.scope }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$SCOPE" = changed ]; then
            # The light pull-request run: the tests vitest relates to this change (its imports, from the merge base),
            # sharded, then the suites that scan source trees run whole on shard 1 whatever changed.
            mb=$(git merge-base "origin/$BASE_REF" HEAD)
            ./node_modules/.bin/vitest run --shard=${{ matrix.shard }}/${{ matrix.total }} --changed "$mb" --passWithNoTests
            if [ "${{ matrix.shard }}" = 1 ]; then ./node_modules/.bin/vitest run test/*-census.test.ts test/*-guard.test.ts test/focus-ring.test.ts; fi
          else
            ./node_modules/.bin/vitest run --shard=${{ matrix.shard }}/${{ matrix.total }}
          fi

  # The pwa checks that are not tests, once (D-6768): the typecheck of pwa runs
  # here and nowhere else. @ccrc/ui rides this job rather than the shards: the
  # pwa suite already typechecks ui's SOURCE transitively (it imports it), so
  # what is added is what that misses — ui's own tsconfig, which also covers
  # .storybook and the stories, and the proof that the generated palettes still
  # match their seeds. Same step-level skip as the shards.
  pwa-static:
    name: pwa typecheck and storybook
    # Same install as the shards: the `deps` entry, restored read-only.
    needs: deps
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCRC_LEG: ${{ (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild') && 'skip' || 'run' }}
    steps:
      - uses: actions/checkout@v7
        if: env.CCRC_LEG == 'run'
        with:
          fetch-depth: 0

      # '22', as `deps` and the server shards: the trees' cache key names the
      # node version setup-node resolves, so another string would always miss.
      - uses: actions/setup-node@v7
        if: env.CCRC_LEG == 'run'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
            ui/package-lock.json

      # The same restored install, ui included, before the typecheck, for the
      # shards' reason above.
      - uses: ./.github/actions/server-deps
        if: env.CCRC_LEG == 'run'
        with:
          platform: linux

      - name: Typecheck
        if: env.CCRC_LEG == 'run'
        working-directory: pwa
        run: ./node_modules/.bin/tsc --noEmit

      - name: Typecheck @ccrc/ui (incl. .storybook and stories)
        if: env.CCRC_LEG == 'run'
        working-directory: ui
        run: ./node_modules/.bin/tsc --noEmit

      - name: Generated palettes match their seeds
        if: env.CCRC_LEG == 'run'
        working-directory: ui
        run: npm run themes:check

      # Storybook is the design system's only surface that RENDERS its
      # components; everything else about ui is a text scrape (vitest runs with
      # `css: false`, so nothing in this repo computes a style). This proves the
      # stories BUILD, not that they look right. RENDERING them is the
      # `storybook-a11y` job below, which is not required; this step stays
      # because it is the cheap half and it runs under a required check.
      - name: Storybook builds (the one surface that renders the components)
        if: env.CCRC_LEG == 'run'
        working-directory: ui
        run: npm run build-storybook

  # `test (pwa)` — required BY NAME, so this job's `name:` is exactly that and
  # no other job reports it (D-6768). It is the verdict over the shards and the
  # static checks, modelled on `server` above: `always()`, so it reports even
  # when a shard failed, and script-free, so it can only ADD red. A shard that
  # failed, was cancelled or was skipped fails it. On a refresh or a rebuild
  # the shards run with every step skipped and report success, as `test` does.
  pwa:
    name: test (pwa)
    needs: [pwa-shard, pwa-static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a shard or the static checks that did not succeed
        if: needs.pwa-shard.result != 'success' || needs.pwa-static.result != 'success'
        run: exit 1
      - name: Every pwa shard and the static checks succeeded
        run: echo "pwa shards ${{ needs.pwa-shard.result }}, static ${{ needs.pwa-static.result }}"

  # ── the one place a component is RENDERED and MEASURED ─────────────────────
  #
  # Every other guard in this repo reads SOURCE. design/audit.mjs parses
  # stylesheet rules, utility-pairs resolves class strings back to tokens, the
  # six censuses read files, and vitest runs with `css: false` — so not one of
  # the ~3,900 tests above can compute a style. quiet-control.test.ts states
  # the hole in its own header: if `bg-raised` fell out of the button variant,
  # every quiet control in the app would render transparent and the whole
  # suite would stay green.
  #
  # This closes it. A real browser loads the built Storybook, renders all 152
  # stories, and the a11y addon runs axe over each one — reading COMPUTED
  # colour, roles and names off real elements. What it measures is what a story
  # happens to render, which is narrower than the gate's every-rule sweep and
  # is exactly the half the gate cannot reach.
  #
  # IT FOUND FOUR THINGS ON ITS FIRST RUN, which is the argument for the
  # dependency: a scrollable `<pre>` no keyboard could focus (`Well`), an
  # `aria-label` on a roleless `<span>` that the accessibility tree was
  # dropping (`TypedLabel`, where holding the name still IS the component's
  # whole purpose), and two story fixtures rendering a nameless button and an
  # unnamed dialog — teaching the next call site to write one.
  #
  # ADDITIVE AND NON-REQUIRED, the `test-macos` arrangement and for the same
  # reason: a red here blocks no pull request while the leg earns trust, and
  # the PR page still shows it. It is deliberately NOT in `full-suite`'s
  # `needs` yet — promote it there once it has run quiet for a while.
  #
  # THE SAME MODE SWITCH AS THE TEST LEGS, written as a job-level `if:`. The
  # `test` matrix and `build-pwa` skip by STEP only because they are required
  # by name and a skipped job never reports; this job is not required, so it
  # skips whole, on exactly their `CCRC_LEG == 'skip'` predicate: an hourly
  # refresh ("no test legs") and a rebuild. And no merge-queue run,
  # like the other advisory legs. Pinned by server/test/ci-pipeline.test.ts.
  storybook-a11y:
    runs-on: ubuntu-latest
    # The browser download dominates; each skin's build and axe run is ~40s
    # for 180 stories, and the job runs one per skin.
    timeout-minutes: 20
    if: github.event_name != 'merge_group' && !(github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild')
    steps:
      # No token left behind: at this checkout major the token sits in a file
      # under the runner's temp directory only for the checkout's own fetch,
      # removed when that step ends. Everything below runs third-party npm
      # code, and none of it has any reason to talk to GitHub.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci
      # Chromium only, and `--with-deps` because a bare runner has none of the
      # shared libraries headless chromium links against. Every tool in this
      # job is a LOCAL binary out of ui/package-lock.json, never `npx`: a bare
      # `npx <tool>` that misses node_modules fetches whatever version is
      # newest that day and runs it.
      - working-directory: ui
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # ONE BUILD PER SKIN (D-5093, its verification clause): the default
      # build is Refined (STORYBOOK_SKIN unset, `resolveSkin` of undefined) and
      # the second opens every story in Instrument. The catalogue's ids and
      # these runs are pinned equal by server/test/ci-pipeline.test.ts.
      - working-directory: ui
        run: npm run build-storybook -- --quiet
      - working-directory: ui
        run: STORYBOOK_SKIN=instrument npm run build-storybook -- --quiet -o storybook-static-instrument
      # Served as static files rather than `storybook dev`: the dev server
      # compiles on demand, so a slow first story reads as a timeout. `vite
      # preview` is the static server already in the lock (vite is how
      # Storybook builds), pointed at the build's output; `--host 127.0.0.1`
      # because `localhost` may resolve to ::1 and the wait below asks
      # 127.0.0.1. The background process outlives this step, which is what
      # the wait is for.
      - working-directory: ui
        run: |
          ./node_modules/.bin/vite preview --outDir storybook-static --host 127.0.0.1 --port 6006 --strictPort &
          ./node_modules/.bin/vite preview --outDir storybook-static-instrument --host 127.0.0.1 --port 6007 --strictPort &
          ./node_modules/.bin/wait-on tcp:127.0.0.1:6006 tcp:127.0.0.1:6007 -t 60000
      # One axe run per skin. The second runs even when the first fails
      # (`!cancelled()`), so a red Refined run never hides Instrument's result.
      - working-directory: ui
        run: npm run test-storybook -- --maxWorkers=2 --url http://127.0.0.1:6006
      - if: ${{ !cancelled() }}
        working-directory: ui
        run: npm run test-storybook -- --maxWorkers=2 --url http://127.0.0.1:6007

  # The Darwin arms' standing mechanism (the macOS port's review, finding 3):
  # every `describe.skipIf(!IS_DARWIN)` block and `itDarwin` case in the
  # server suite skips on every ubuntu leg above, so without this job the
  # port's launchd/BSD paths are verified exactly once — on the author's own
  # box, unreproducibly — and never again after merge. This leg is what
  # turns those tests from prose into a mechanism.
  #
  # A SEPARATE JOB, not a matrix `os` dimension, deliberately: branch
  # protection requires the checks `test (server)` / `test (agent)` /
  # `test (pwa)` / `build-pwa` BY NAME, and adding a matrix axis to `test`
  # renames one of them. `test-macos` is additive and non-required — a red
  # here blocks no pull request, which is the right cost while the leg earns
  # trust, and the PR page still shows it. It DOES gate a promotion:
  # `full-suite` below needs it green (design 2026-09-23 ruling 6).
  #
  # Server package only: it owns the ccd/ccrc/doctor/expose/update suites and
  # every Darwin test in the tree. No tsc step — types have no platform.
  #
  # Sharded across machines and two workers per shard: the unsharded leg had
  # outgrown its deadline (the last 13 completed legs to 2026-09-23 were all
  # cut at 55 minutes). The original one-worker policy was superseded by
  # D-3527 after hosted `macos-26-arm64` runs measured a 20.64 -> 12.99 minute
  # critical-path improvement, then 12.44 and 12.25 minute repetitions, with
  # identical file, case, skip and failure identities. At most 2 shards on a
  # pull request and 4 in full, so the organisation's 5-job macOS cap still
  # leaves room for `probe-macos`.
  test-macos:
    name: test-macos ${{ matrix.shard }}/${{ matrix.total }}
    needs: select
    # Never on a merge-queue run (landing-order stage 2) NOR on a pull request
    # (amendment 2026-10-15, design §16): non-required, so nothing waited for it,
    # yet its red was read as the PR's. The daily, dispatched and stable-gate
    # full runs keep it (ruling 6). `probe-macos` has its own allow-list.
    if: github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.select.outputs.macos_count != '0' && (needs.select.outputs.tests == 'selected' || needs.select.outputs.tests == 'full')
    runs-on: macos-latest
    # 55, not the 30 of a Linux shard, and the number is the measurement
    # rather than a round multiple of one run. Six green unsharded legs
    # (2026-08-27): 18.6, 21.1, 21.9, 23.3, 24.7, 28.1 minutes — brew, then the
    # whole server suite on a slower runner, with real spread. 45 was picked
    # from the first two of those and was 1.6x the max once all six were in;
    # 55 is ~2x, which is the headroom a runner this variable needs before a
    # slow-but-healthy leg starts reading as a wedge. A shard carries a
    # fraction of that suite, so 55 is now generous rather than tight.
    #
    # It is also the leg that most needs a deadline at all: this suite has
    # already hung here once, on its first run, when a missing `gtimeout` left
    # `_plat_timeout` with no deadline of its own. A wedge is unbounded;
    # nothing near 55 is. The cost of a wedge here is not money — standard
    # hosted runners, macOS included, are free on a public repository — but
    # wall-clock, and one of the organisation's five concurrent macOS slots
    # (queue waits of 13-18 minutes measured, 2026-09-23).
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      # bash, tmux, flock, jq and coreutils from Homebrew — the reasons are
      # in the action, beside the install line.
      - uses: ./.github/actions/server-deps
        with:
          platform: macos
      - name: Test
        working-directory: server
        env:
          FILES: ${{ matrix.files }}
          VITEST_SHARD: ${{ matrix.vitest_shard }}
          WORKERS: ${{ matrix.workers }}
        run: |
          echo "$FILES" | tr ' ' '\n' > "$RUNNER_TEMP/tests.txt"
          CCRC_TEST_LIST="$RUNNER_TEMP/tests.txt" ./node_modules/.bin/vitest run --config vitest.select.config.ts ${VITEST_SHARD:+--shard=$VITEST_SHARD} --maxWorkers="$WORKERS"

  # THE PROBE LEG — a platform CONTRACT check that is not hostage to the suite.
  #
  # `test-macos` above is a 303-file run, and it has stopped being able to
  # report: of its three runs on 2026-09-12 one completed at 39 min and TWO
  # were cut at the 55-minute deadline mid-`Test`, answering nothing. A leg
  # that cannot finish cannot be iterated against, and D-2614 — a credential
  # path that fails on macOS and only macOS — can only be settled by asking a
  # real Mac a question and reading the answer.
  #
  # So this job asks exactly one file's worth of questions about what
  # `script(1)` does on this userland, in about two minutes. It is deliberately
  # NOT folded into `test-macos`: the whole point is that its answer survives
  # whatever the big suite does, including being cut. Same reason it is not
  # required — it reports, it does not gate. (Sharding `test-macos` changes
  # none of this: the probe still must not wait on, or share a fate with, the
  # selector; so it reads no select output, and `full-suite` does not need it.)
  #
  # `--reporter=verbose` because the answer travels in the assertion MESSAGE
  # (each case carries `script`'s rc and stderr), and the default reporter
  # elides those for passing cases.
  probe-macos:
    # Pull requests and the daily run only: an advisory probe must not gate a
    # dispatched full run, or release-stable's called one.
    if: github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule != '23 * * * *')
    runs-on: macos-latest
    # 25, not 10. The first run was cut at 10 with the auth suite still going,
    # and the reason is D-2661 rather than the suite being big: several cases
    # ran to the fixture's 60_000 ms `execFileSync` cap against deadlines of 6
    # to 25 seconds, because `_plat_timeout`'s deadline intermittently does not
    # fire on this runner. One of them (`runs the UPSTREAM launcher…`) still
    # PASSED at 60078 ms, since its assertions read files rather than `rc` — so
    # the symptom is silent cost, not a red.
    #
    # 25 is ~2x the observed worst case with several such stalls, and stays well
    # under `oss-metadata.test.ts`'s 60-minute ceiling. It is a budget for a
    # KNOWN defect, not headroom for an unknown one: when D-2661 closes this
    # should come back down.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The same set as `test-macos`, and for the same reasons — this leg now
      # runs the auth helper's own suite too, which drives `_plat_timeout`
      # (whose Darwin fallback is `gtimeout`, from coreutils), plants tmux and
      # flock stubs, and reads jq.
      #
      # An earlier revision of this job installed `bash` alone, reasoning that
      # `gtimeout`'s absence is what D-2661 suspects and the leg should meet the
      # userland bare. That conflated two things: the `script(1)` probe never
      # calls `timeout`, so coreutils cannot colour its measurement, while the
      # auth suite would have hung for D-2661's reason and reported nothing
      # about the darwin arm. Measuring the deadline shim bare is a DIFFERENT
      # probe and needs its own job, not this one's omission.
      - name: Install system dependencies
        run: brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: npm ci
      - name: Probe
        working-directory: server
        run: ./node_modules/.bin/vitest run test/script-shim-platform.test.ts test/compact-lock-darwin-probe.test.ts --reporter=verbose
      # THE TWO PANE-BOUND DESCRIBES ONLY, and the narrowing is the point.
      #
      # This step began as the whole `ccd-account-auth.test.ts` file and was cut
      # at 10 minutes, then again at 25 — not because the file is big (~40s on
      # linux) but because D-2661 makes individual cases run to the fixture's
      # 60_000 ms cap instead of their 6-to-25-second deadlines. Most of that
      # cost is in describes that have nothing to do with D-2614.
      #
      # `setup-token` and `openai-login` are the two methods that go through
      # `script(1)`, so they are the two D-2673 changes the shape of, and they
      # are the whole question this leg exists to answer. Everything else about
      # the helper is already answered on linux and by `test-macos` when it
      # manages to finish.
      #
      # Measured on 52934a2e, the run this replaces: `the mint exited 1`
      # appeared ZERO times, against NINE before the fix, with the setup-token
      # describe demonstrably reached. That is what says D-2673 works; this
      # narrowing is what lets a run say it without being cut first.
      # The spawn must TERMINATE — the D-2734 property, asked on the platform
      # whose arm it is. These cases force `CCD_OS` themselves, so they are red
      # on Linux too; running them here checks the real userland agrees.
      # THE TWO QUESTIONS D-2614's work left open, and neither can be asked on
      # Linux. Placed FIRST because they are pure measurement: they change no
      # shipped code, and if a later step reds we still get their answer.
      - name: Platform hazards — the deadline, and grep over a FIFO (D-2661, D-2739)
        working-directory: server
        run: ./node_modules/.bin/vitest run test/platform-hazards.test.ts --reporter=verbose
      - name: The pane-bound spawn terminates (D-2734..D-2737)
        working-directory: server
        run: ./node_modules/.bin/vitest run test/ccd-account-auth.test.ts --reporter=verbose -t 'spawn has to END'
      - name: The two pane-bound methods (what D-2673 changes)
        working-directory: server
        run: ./node_modules/.bin/vitest run test/ccd-account-auth.test.ts --reporter=verbose -t 'setup-token|openai-login'

  build-pwa:
    runs-on: ubuntu-latest
    # Under a minute in practice; 15 is headroom for a cold npm cache.
    timeout-minutes: 15
    # Required by name, like `test`: no job-level `if:`, steps skip instead.
    env:
      CCRC_LEG: ${{ (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild') && 'skip' || 'run' }}
    steps:
      - uses: actions/checkout@v7
        if: env.CCRC_LEG == 'run'
      - uses: actions/setup-node@v7
        if: env.CCRC_LEG == 'run'
        with:
          # '22' here for consistency with the server shards, not because
          # anything checks it. This job runs `npm run build` in pwa/ and
          # never invokes vitest, so server/test/node-floor.test.ts — which
          # only exists as a `server` package test — does NOT execute on this
          # leg. Lowering node-version here, alone, is caught by nothing in
          # this workflow: the `server-shard` job's node-version is gated only
          # against the interpreter falling below the declared floor (see the
          # comment on that job's setup-node step), and the `node-floor` job's
          # is the one string pinned equal to the floor.
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      # The build reads ui SOURCE through `exports['.']`. Same resolution rule
      # as the test leg: ui's own node_modules or nothing resolves.
      #
      # `vite build` alone, not `npm run build` (`tsc --noEmit && vite build`):
      # `test (pwa)`'s Typecheck step (in `pwa-static`, D-6768) already runs
      # that same `tsc --noEmit` on every run, so the second copy here bought
      # nothing but a duplicate (D-6770). Exactly one pwa typecheck runs per CI
      # run, in that job.
      - if: env.CCRC_LEG == 'run'
        working-directory: ui
        run: npm ci
      - if: env.CCRC_LEG == 'run'
        working-directory: pwa
        run: npm ci && ./node_modules/.bin/vite build
      # The build is only proven by its output existing. A green build step with
      # no artifact is the failure this repo has already shipped once.
      - if: env.CCRC_LEG == 'run'
        run: test -f server/dist-pwa/index.html

  # THE REAL-BROWSER LEG (native Docs reader spec 2026-10-01 §5.7, U4). pwa's
  # second vitest config drives a real Chrome through playwright-core for the
  # claims jsdom cannot show: what Chrome does with the docs response headers
  # and with an SVG drawn as an image (M5.B5, M5.B6). ubuntu-latest ships
  # /usr/bin/google-chrome, which the harness takes when CCRC_CHROME is unset;
  # with neither, its beforeAll throws, so a missing browser is a red leg and
  # never a skipped one.
  #
  # Not a branch-protection check (operator ruling 2026-10-13), but
  # `full-suite` needs it, so a red browser leg fails the daily run and the
  # stable gate. No job-level `if:` and no `needs:`: it skips by STEP on a
  # refresh or a rebuild, like the required legs, because a job skipped by
  # `if:` reads as red in full-suite. Pinned by ci-pipeline.test.ts.
  browser-pwa:
    name: browser (pwa)
    runs-on: ubuntu-latest
    # About a minute of tests after npm ci; 15 is headroom for a cold npm
    # cache and a slow Chrome start, as build-pwa's is.
    timeout-minutes: 15
    env:
      CCRC_LEG: ${{ (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild') && 'skip' || 'run' }}
    steps:
      - uses: actions/checkout@v7
        if: env.CCRC_LEG == 'run'
        with:
          fetch-depth: 0
      # The light pull-request rule (operator ruling 2026-10-25), see the agent leg:
      # only a pull request asks, and only the browser leg's tests skip.
      - name: Can this change reach the browser tests?
        id: reach
        if: env.CCRC_LEG == 'run' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: node .github/ci/reach.mjs --pkg browser --event pull_request --base "origin/$BASE_REF" --full-label "$FULL_LABEL"

      - uses: actions/setup-node@v7
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        working-directory: pwa
        run: npm ci
      # BEFORE the browser config runs, for the test matrix's reason above: pwa
      # reads @ccrc/ui as SOURCE, and the leg's imports reach it (lib/router.ts,
      # through DocImage), which resolves only from ui's own node_modules.
      - name: Install @ccrc/ui
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        working-directory: ui
        run: npm ci
      # Local binary, never npx (see the test matrix above).
      - name: Test
        if: env.CCRC_LEG == 'run' && steps.reach.outputs.skip != 'true'
        working-directory: pwa
        run: ./node_modules/.bin/vitest run --config vitest.browser.config.ts

  # THE FLOOR ITSELF, on exactly its own version (ccrc history spec
  # 2026-10-05 §9.9; O18). Every other leg runs '22', which setup-node
  # resolves to the newest 22.x — far above `engines.node` — so no other leg
  # can tell a floor that holds from one that only holds on a newer
  # interpreter. This one runs node-floor.test.ts (and, from W1-B1 on, every
  # history test file, each appended to the list below by the PR that adds
  # it) on the floor's own version, through vitest.select.config.ts so the
  # list is exact. Its `node-version` is pinned equal to `engines.node` by
  # server/test/ci-pipeline.test.ts, and so is its name.
  #
  # Not required BY NAME (the required checks are test (server), test (agent),
  # test (pwa) and build-pwa), but `full-suite` needs it, so it gates a
  # stable promotion. Its only job-level `if:` is `!cancelled()`, so a failed
  # `needs:` never skips it: it skips by STEP on a refresh, a rebuild, or a
  # pull request that changed none of its inputs (D-6771), like the required
  # legs, because a job skipped by `if:` reads as red in full-suite. Default
  # checkout depth: nothing on its list reads the commit range.
  node-floor:
    name: node floor (22.16.0)
    # D-6771: `select` only lends its `floor` output — on a pull request it
    # runs only when `select` found one of its inputs changed; every other
    # event runs it unless it is a refresh or a rebuild.
    needs: [select, deps]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # server-deps installs four packages from a cold cache in about three
    # minutes (it restores them from the `deps` job's entry otherwise); the
    # list runs in seconds. 30 is a deadline, not an estimate.
    timeout-minutes: 30
    env:
      CCRC_LEG: ${{ (github.event.schedule == '23 * * * *' || inputs.mode == 'refresh' || inputs.mode == 'rebuild' || (github.event_name == 'pull_request' && needs.select.outputs.floor != 'true')) && 'skip' || 'run' }}
    steps:
      - uses: actions/checkout@v7
        if: env.CCRC_LEG == 'run'
      - uses: actions/setup-node@v7
        if: env.CCRC_LEG == 'run'
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      - uses: ./.github/actions/server-deps
        if: env.CCRC_LEG == 'run'
        with:
          platform: linux
      # One server-relative path per line between the EOF markers; a PR that
      # adds a history test file appends it here (an edit under .github/,
      # which selects the full suite). ci-pipeline.test.ts requires every
      # listed file to exist.
      - name: Test
        if: env.CCRC_LEG == 'run'
        working-directory: server
        run: |
          cat > "$RUNNER_TEMP/tests.txt" <<'EOF'
          test/node-floor.test.ts
          test/history-lib.test.ts
          test/history-store.test.ts
          test/history-sweep.test.ts
          test/history-drain.test.ts
          test/history-ingest.test.ts
          test/history-holds.test.ts
          test/history-op.test.ts
          test/history-cli.test.ts
          test/history-parser.test.ts
          test/history-recall.test.ts
          test/history-maint.test.ts
          test/history-recover.test.ts
          test/history-export.test.ts
          test/measure-history.test.ts
          test/history-derive.test.ts
          test/history-skill.test.ts
          test/history-card.test.ts
          test/history-replay.test.ts
          EOF
          CCRC_TEST_LIST="$RUNNER_TEMP/tests.txt" ./node_modules/.bin/vitest run --config vitest.select.config.ts

  # The traced runs that build the dependency map (design 2026-09-23 §5): each
  # listed server test in its own vitest process under strace. Scheduled
  # runs and manual rebuilds trace every file; a refresh traces what the
  # merge affected. Its test results are NOT a verdict — tracing perturbs
  # the timing-budget tests: a traced test that fails is recorded `unknown`,
  # so the map selects it until a clean trace replaces it, and trace-run.mjs
  # still exits 0. What goes red is map-build, and only for a test that
  # NEWLY fails under trace (spec §5.4). The records are kept even when the
  # Trace step itself fails.
  trace-shard:
    name: trace ${{ matrix.shard }}/${{ matrix.total }}
    needs: [select, deps]
    if: ${{ !cancelled() && needs.select.outputs.trace != 'none' && needs.select.outputs.trace_count != '0' }}
    runs-on: ubuntu-latest
    # Tracing costs 1.7-4.3x wall-clock (measured on the fleet box), and the
    # shard planner packs trace shards to about 15 minutes at that cost; 60 is
    # oss-metadata.test.ts's ceiling and the most any job here may take.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.trace_matrix) }}
    steps:
      # Full depth for the same reason as server-shard: the traced tests are
      # the real tests, topology-clean included.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      - uses: ./.github/actions/server-deps
        with:
          platform: linux
      # Exactly this row's files. The trace plan is always a real partition —
      # select.mjs packs it by duration, or at a default per file when none is
      # known yet — so there is no vitest `i/n` to split here.
      - name: Trace
        env:
          FILES: ${{ matrix.files }}
          WORKERS: ${{ matrix.workers }}
        run: |
          echo "$FILES" | tr ' ' '\n' > "$RUNNER_TEMP/trace.txt"
          node .github/ci/trace-run.mjs --repo "$GITHUB_WORKSPACE" --files "$RUNNER_TEMP/trace.txt" --out "$RUNNER_TEMP/records.json" --jobs "$WORKERS" --timeout 1560
      - name: Keep the records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: records-${{ matrix.shard }}
          path: ${{ runner.temp }}/records.json
          if-no-files-found: error
          retention-days: 3

  # Merges the trace shards into a map for this commit and publishes it
  # (design 2026-09-23 §5.3-§5.5). Runs after a failed trace shard too (a
  # crashed trace-run — a traced test that fails is only recorded `unknown`),
  # but refuses when a shard left NO records file at all. A refresh is also
  # told what select MEANT to trace (`--traced`), so a test missing from the
  # records that did arrive is written `unknown` rather than keeping its old
  # entry: those are exactly the tests the merge affected. The map is
  # published as the `testmap` artifact — what select fetches next time, and
  # what a replay (spec §11.3) fetches. testmap.mjs exits 3 when a traced test
  # NEWLY fails under trace (failing now, not unknown in the map this run
  # started from) and 4 when a floor test lost its breadth — both only AFTER
  # the map is written, so the map is published anyway and the job's last
  # step turns it red. A test that always fails under tracing reds the first
  # build that sees it, not every run after (spec §5.4).
  map-build:
    needs: [select, trace-shard]
    if: always() && needs.select.result == 'success' && needs.select.outputs.trace_count != '0' && (needs.trace-shard.result == 'success' || needs.trace-shard.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read — the check before a refresh publishes asks which trusted
    # map is newest.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: records-*
          path: ${{ runner.temp }}/records
      - name: Fetch what select handed over
        uses: actions/download-artifact@v8
        with:
          name: select-inputs
          path: ${{ runner.temp }}/select-inputs
      - name: Build the map
        id: build
        env:
          TRACE: ${{ needs.select.outputs.trace }}
          MAP_SHA: ${{ needs.select.outputs.map_sha }}
          TRACE_MATRIX: ${{ needs.select.outputs.trace_matrix }}
        run: |
          want=$(node -e 'console.log(JSON.parse(process.env.TRACE_MATRIX).include.length)')
          mkdir -p "$RUNNER_TEMP/flat" "$RUNNER_TEMP/ci-cache"
          # Two layouts (D-6740): several artifacts each land in their own
          # records-<shard>/ directory, but download-artifact v5 and later
          # extract a pattern that matches ONE artifact straight into the path,
          # as records/records.json. The single file counts only when no
          # directory holds one, so nothing is counted twice; either way each
          # copy is named records*.json, the names testmap.mjs reads.
          shopt -s nullglob
          recs=("$RUNNER_TEMP"/records/records-*/records.json)
          shopt -u nullglob
          if [ "${#recs[@]}" -eq 0 ] && [ -f "$RUNNER_TEMP/records/records.json" ]; then recs=("$RUNNER_TEMP/records/records.json"); fi
          got=0
          for f in "${recs[@]}"; do
            d=$(dirname "$f")
            n=$(basename "$d")
            cp "$f" "$RUNNER_TEMP/flat/$n.json"; got=$((got + 1))
          done
          if [ "$got" -ne "$want" ]; then
            echo "::error::$got of $want trace shards left records; no map is written for this commit"
            exit 1
          fi
          # The live tests, from THE one listing select.mjs builds every list
          # from (NUL-delimited, never git's quoted form — final review FR-2).
          node .github/ci/select-tests.mjs live-tests --repo "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/live.txt"
          old=()
          if [ -f "$RUNNER_TEMP/select-inputs/testmap.json" ]; then old=(--old "$RUNNER_TEMP/select-inputs/testmap.json"); fi
          rc=0
          if [ "$TRACE" = refresh ] && [ -n "$MAP_SHA" ]; then
            node .github/ci/testmap.mjs refresh --sha "$GITHUB_SHA" --old "$RUNNER_TEMP/select-inputs/testmap.json" \
              --records "$RUNNER_TEMP/flat" --live "$RUNNER_TEMP/live.txt" --traced "$RUNNER_TEMP/select-inputs/traced.txt" \
              --out "$RUNNER_TEMP/ci-cache/testmap.json" || rc=$?
          else
            node .github/ci/testmap.mjs build --sha "$GITHUB_SHA" "${old[@]}" --records "$RUNNER_TEMP/flat" --out "$RUNNER_TEMP/ci-cache/testmap.json" || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 3 and 4 come after the map is written: publish it, go red at the end.
          if [ "$rc" != 0 ] && [ "$rc" != 3 ] && [ "$rc" != 4 ]; then exit "$rc"; fi
      # A refresh publishes only if, when checked just before the upload, the
      # map it was built on is still the newest trusted map (a daily rebuild,
      # or another refresh, may have published since select fetched it). The
      # check and the upload are two steps, not one atomic act: a map
      # published in the seconds between them is not seen, and this refresh's
      # map then becomes the newest. The worst case is that a rebuild's
      # corrections wait for the next rebuild; selection stays safe, because
      # every map is a correct map for its own commit. A rebuild, or a
      # refresh that had no map and traced everything, always publishes.
      - name: Is the map this refresh was built on still the newest?
        id: cas
        if: needs.select.outputs.trace == 'refresh' && needs.select.outputs.map_sha != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          base=$(cat "$RUNNER_TEMP/select-inputs/testmap.artifact")
          newest=$(GITHUB_OUTPUT='' node .github/ci/main-artifact.mjs --repo "$REPO" --repo-id "$REPO_ID" --name testmap | sed -n 's/^artifact_id=//p')
          if [ -n "$base" ] && [ "$newest" = "$base" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the map this refresh was built on (artifact $base) is no longer the newest trusted map (${newest:-none}); not publishing — the next refresh diffs from the newer one"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the map as an artifact
        if: steps.cas.outputs.publish != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: testmap
          path: ${{ runner.temp }}/ci-cache/testmap.json
          if-no-files-found: error
          retention-days: 14
      # Last, so the map above is published first: the Build step's
      # annotations name each test (3: newly fails under trace; 4: a floor test
      # written unknown). Both stay selected — an unknown test always runs.
      # News is REPORTED, not failed (D-6769): the hourly refresh gates
      # nothing, a red one would only page whoever is watching main, and the
      # map it published is correct. The daily rebuild uses the same step; its
      # verdict is the full-suite job, not this one.
      - name: Report what the map build found
        if: steps.build.outputs.rc != '0'
        env:
          RC: ${{ steps.build.outputs.rc }}
        run: |
          case "$RC" in
            3) what='at least one test newly fails under trace, or timed out' ;;
            4) what='a floor test lost its breadth and was written unknown' ;;
            *) what="testmap.mjs exited $RC" ;;
          esac
          echo "::warning::the map was published, and the map build reported news: $what — read the Build the map step's annotations"
          {
            echo '### Map build news'
            echo
            echo "testmap.mjs exited \`$RC\`: $what. The map was published; those tests stay selected until a clean trace replaces them."
          } >> "$GITHUB_STEP_SUMMARY"

  # The per-file durations the shard planner packs by, from the untraced
  # full run's JSON reports, published as the `testtimes` artifact. Only on
  # main: select reads durations only from trusted main runs anyway.
  times-build:
    needs: [select, server-shard]
    if: always() && needs.select.outputs.tests == 'full' && github.ref == 'refs/heads/main' && (needs.server-shard.result == 'success' || needs.server-shard.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: times-*
          path: ${{ runner.temp }}/times
      - name: Merge the durations
        run: |
          mkdir -p "$RUNNER_TEMP/ci-cache"
          # Two layouts (D-6740): several artifacts each land in their own
          # times-<shard>/ directory, but download-artifact v5 and later
          # extract a pattern that matches ONE artifact straight into the path,
          # as times/times.json. The single file counts only when no directory
          # holds one; shards.mjs is handed only files that exist, never an
          # unmatched glob, and no file at all fails the step.
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/times/*/times.json)
          shopt -u nullglob
          if [ "${#reports[@]}" -eq 0 ] && [ -f "$RUNNER_TEMP/times/times.json" ]; then reports=("$RUNNER_TEMP/times/times.json"); fi
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::no shard left a times.json; no durations are written"
            exit 1
          fi
          node .github/ci/shards.mjs times --out "$RUNNER_TEMP/ci-cache/testtimes.json" "${reports[@]}"
      - name: Keep the durations as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: testtimes
          path: ${{ runner.temp }}/ci-cache/testtimes.json
          if-no-files-found: error
          retention-days: 14

  # THE STABLE GATE'S EVIDENCE (design 2026-09-23 §8). Exists only in `full`
  # mode, and is green iff every leg is — the Linux shards through their
  # summary, the typecheck, agent, pwa, the build, the macOS shards, the
  # Node-floor leg and the browser leg.
  # release-stable.yml looks for a successful job with this name in a trusted
  # run of the commit it promotes — this file's daily or manual full run on
  # main, or its own earlier call (`<caller job> / full-suite`), never a pull
  # request's run (main-artifact.mjs green-full-suite) — and reads the
  # `verdict` output when it called this file itself.
  full-suite:
    needs: [select, server, server-shard, server-typecheck, test, pwa, build-pwa, test-macos, node-floor, browser-pwa]
    # Never on a merge-queue run or a pull request: both skip test-macos, and a
    # run that fell back to `full` would read that skip as a red leg (landing-
    # order stage 2; amendment 2026-10-15). Neither is ever the stable gate's
    # evidence: main-artifact.mjs trusts no merge_group or pull_request run.
    if: always() && github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.select.outputs.tests == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      # Script-free, and can only ADD red: any leg that did not succeed fails
      # this job before verdict.mjs is even checked out.
      - name: Refuse any leg that did not succeed (no script involved)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The `verdict` output is written by THIS step, once verdict.mjs exits 0:
      # a step's GITHUB_OUTPUT is its own, and the job output reads this step's.
      # RESULTS is one `name=result` pair per need — not the whole needs context, which
      # carries every select matrix and outgrows an environment string's 128 KB.
      - name: Verdict
        id: verdict
        env:
          RESULTS: select=${{ needs.select.result }} server=${{ needs.server.result }} server-shard=${{ needs.server-shard.result }} server-typecheck=${{ needs.server-typecheck.result }} test=${{ needs.test.result }} pwa=${{ needs.pwa.result }} build-pwa=${{ needs.build-pwa.result }} test-macos=${{ needs.test-macos.result }} node-floor=${{ needs.node-floor.result }} browser-pwa=${{ needs.browser-pwa.result }}
        run: |
          node .github/ci/verdict.mjs full
          echo "verdict=green" >> "$GITHUB_OUTPUT"
