# DIAGNOSTIC ONLY — scratch branch ci/macos-diag-*, never merged. Dispatch-only: a push here triggers nothing.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy-diag:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      - uses: ./.github/actions/server-deps
        with:
          platform: macos
      - name: Machine
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string || true
          sw_vers || true
          which -a python3; python3 -VV
          node -e 'const os=require("os");console.log("availableParallelism",os.availableParallelism(),"cpus",os.cpus().length)'
          echo "TMPDIR=$TMPDIR"
      - name: Python startup, full env vs the harness's minimal env
        run: |
          now() { perl -MTime::HiRes=time -e 'printf "%.3f", time'; }
          for i in 1 2 3; do t0=$(now); python3 -c pass; echo "full    python3 -c pass: $(perl -e "printf '%.3f', $(now) - $t0")s"; done
          for i in 1 2 3; do H=$(mktemp -d); t0=$(now); (cd "$H" && env -i PATH="$PATH" HOME="$H" python3 -c pass); echo "minimal python3 -c pass: $(perl -e "printf '%.3f', $(now) - $t0")s"; done
      - name: Python primitives, full env
        run: python3 .github/diag/py-primitives.py full
      - name: Python primitives, minimal env
        run: H=$(mktemp -d); env -i PATH="$PATH" HOME="$H" python3 "$PWD/.github/diag/py-primitives.py" minimal
      - name: The proxy started by hand
        run: bash .github/diag/proxy-start.sh
      - name: The real test file, instrumented, four cases
        if: always()
        working-directory: server
        run: |
          echo test/ccgpt-proxy.test.ts > "$RUNNER_TEMP/tests.txt"
          CCRC_TEST_LIST="$RUNNER_TEMP/tests.txt" ./node_modules/.bin/vitest run --config vitest.select.config.ts \
            -t 'usable python3|mints a distinct lane id|deeply-nested body|names the bind failure' \
            --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/proxy-cases.json" || true
      - name: Keep the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"; cp -R /tmp/ccgpt-diag "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/proxy-cases.json" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-diag
          path: ${{ runner.temp }}/evidence
          retention-days: 7

  census:
    name: census ${{ matrix.shard }}/4
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      - uses: ./.github/actions/server-deps
        with:
          platform: macos
      - name: Every server test file but ccgpt-proxy, per-case JSON
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          rm -f test/fixtures/pystub/sitecustomize.py
          ls test/*.test.ts | grep -v '^test/ccgpt-proxy.test.ts$' > "$RUNNER_TEMP/tests.txt"
          wc -l < "$RUNNER_TEMP/tests.txt"
          node -e 'const os=require("os");console.log("availableParallelism",os.availableParallelism())'
          CCRC_TEST_LIST="$RUNNER_TEMP/tests.txt" ./node_modules/.bin/vitest run --config vitest.select.config.ts --shard="$SHARD/4" \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/census-$SHARD.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-${{ matrix.shard }}
          path: ${{ runner.temp }}/census-${{ matrix.shard }}.json
          retention-days: 7
