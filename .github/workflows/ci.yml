# DIAGNOSTIC ONLY — scratch branch ci/macos-diag-*, never merged. Dispatch-only: a push here triggers nothing.
# Round 3: repeat the full fixed suite twice with two workers to test stability before changing policy.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    name: w${{ matrix.workers }} ${{ matrix.shard }}/4
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workers: [2]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      - uses: ./.github/actions/server-deps
        with:
          platform: macos
      - name: Every server test file, per-case JSON
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
          WORKERS: ${{ matrix.workers }}
        run: |
          ls test/*.test.ts > "$RUNNER_TEMP/tests.txt"
          wc -l < "$RUNNER_TEMP/tests.txt"
          CCRC_TEST_LIST="$RUNNER_TEMP/tests.txt" ./node_modules/.bin/vitest run --config vitest.select.config.ts --shard="$SHARD/4" --maxWorkers="$WORKERS" \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/ab-w$WORKERS-$SHARD.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-w${{ matrix.workers }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ab-w${{ matrix.workers }}-${{ matrix.shard }}.json
          retention-days: 7
