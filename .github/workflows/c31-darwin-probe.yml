# THROWAWAY (Task C31, D-8391): repeats release-main.test.ts on macOS, alone and
# inside the shard whose run it failed in, with every signal sender logged and
# the release scripts traced. Second run: at the fix (build-release.sh stages
# through a file). Removed before the wave-done; it runs on a push to
# the task's own branch only.
name: c31-darwin-probe

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c31']
    paths: ['.github/c31-darwin-probe/**', '.github/workflows/c31-darwin-probe.yml']

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        leg: [alone, shard]
    runs-on: macos-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            agent/package-lock.json
            pwa/package-lock.json
      - uses: ./.github/actions/server-deps
        with:
          platform: macos
      - name: Versions
        run: |
          node --version; bash --version | head -1; command -v bash tar gtar gzip shasum timeout gtimeout || true; sysctl -n hw.ncpu hw.memsize kern.maxproc; uptime; git rev-parse HEAD
      - name: release-main alone, repeated
        if: matrix.leg == 'alone'
        working-directory: server
        run: bash ../.github/c31-darwin-probe/repeat.sh 30 alone 2 test/release-main.test.ts test/build-release.test.ts
      - name: the failing shard's files, repeated
        if: matrix.leg == 'shard'
        working-directory: server
        run: bash ../.github/c31-darwin-probe/repeat.sh 2 shard 2 --list "$GITHUB_WORKSPACE/.github/c31-darwin-probe/shard-files.txt"
