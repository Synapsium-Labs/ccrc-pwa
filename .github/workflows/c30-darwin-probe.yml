# THROWAWAY (Task C30, D-8381): repeats spawnSyncGroup with an `input` on macOS,
# at several input sizes, bare and under a test shard's load, and the callers
# that pass an input. Removed before the
# wave-done; it runs on a push to the task's own branch only.
name: c30-darwin-probe

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c30']
    paths: ['.github/c30-darwin-probe/**', '.github/workflows/c30-darwin-probe.yml']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install system dependencies
        run: .github/ci/bounded.sh 300 brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: ../.github/ci/bounded.sh 180 npm ci
      - name: Versions
        run: |
          node --version; bash --version | head -1; sysctl -n hw.ncpu hw.memsize net.local.stream.sendspace net.local.stream.recvspace; uptime; git rev-parse HEAD
      - name: the fixed spawnSyncGroup and a pipe-input control, by size, bare and under a test shard's load
        working-directory: server
        run: |
          w() { node --experimental-strip-types --no-warnings ../.github/c30-darwin-probe/probe.mjs "$@" & p=$!; node ../.github/c30-darwin-probe/watch.mjs "$p" "$2" & q=$!; wait "$p"; kill "$q" 2>/dev/null || true; }
          w 12000 bare-group-128k 131072
          ( while [ ! -e "$RUNNER_TEMP/stop-load" ]; do ./node_modules/.bin/vitest run --maxWorkers=2 test/ccd-child-reclaim-pin.test.ts test/ccd-reclaim-tail-window.test.ts test/ccd-reclaim-tail-mounts.test.ts test/ccd-ws-reap.test.ts >/dev/null 2>&1; done ) &
          sleep 30
          w 6000 shard-ctl-128k 131072 ctl
          w 12000 shard-ctl-4k 4096 ctl
          w 12000 shard-ctl-0 0 ctl
          w 12000 shard-group-128k 131072
          w 6000 shard-group-0 0
          touch "$RUNNER_TEMP/stop-load"; wait
      - name: the nine callers that pass an input, and the helper's own cases, repeated
        working-directory: server
        run: |
          bash ../.github/c30-darwin-probe/repeat.sh 2 callers test/box-settings-table.test.ts test/box-settings-read.test.ts test/ccrc-account.test.ts test/ccrc-settings-verb.test.ts test/ccrc-settings-carveouts.test.ts test/delegation-adoption-corpus.test.ts test/testbox-admin-contract.test.ts test/testbox-overlay.test.ts test/session-hook-steer.test.ts test/proc-leak.test.ts
