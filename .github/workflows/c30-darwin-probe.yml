# THROWAWAY (Task C30, D-8381): repeats spawnSyncGroup with an `input` on macOS,
# at several input sizes, bare and under a test shard's load. Removed before the
# wave-done; it runs on a push to the task's own branch only.
name: c30-darwin-probe

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c30']
    paths: ['.github/c30-darwin-probe/**', '.github/workflows/c30-darwin-probe.yml']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install system dependencies
        run: .github/ci/bounded.sh 300 brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: ../.github/ci/bounded.sh 180 npm ci
      - name: Versions
        run: |
          node --version; bash --version | head -1; sysctl -n hw.ncpu hw.memsize net.local.stream.sendspace net.local.stream.recvspace; uptime; git rev-parse HEAD
      - name: spawnSyncGroup with an input, by size, bare and under a test shard's load
        working-directory: server
        run: |
          w() { node --experimental-strip-types --no-warnings ../.github/c30-darwin-probe/probe.mjs "$@" & p=$!; node ../.github/c30-darwin-probe/watch.mjs "$p" "$2" & q=$!; wait "$p"; kill "$q" 2>/dev/null || true; }
          w 3000 bare-ctl-128k 131072 ctl
          w 6000 bare-group-128k 131072
          w 3000 bare-group-16k 16384
          w 6000 bare-group-4k 4096
          w 6000 bare-group-0 0
          ( ./node_modules/.bin/vitest run --maxWorkers=2 test/ccd-child-reclaim-pin.test.ts test/ccd-reclaim-tail-window.test.ts test/ccd-reclaim-tail-mounts.test.ts test/ccd-ws-reap.test.ts >/dev/null 2>&1 ) &
          sleep 30
          w 3000 shard-group-128k 131072
          w 3000 shard-group-4k 4096
          w 3000 shard-group-0 0
          kill %1 2>/dev/null || true
