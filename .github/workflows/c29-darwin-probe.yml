# THROWAWAY (Task C29, D-8354): repeats the prune-deny cost case's jq
# invocation and the two red files on macOS, bare and under a test shard's
# load. Removed before the wave-done; it runs on a push to the task's own
# branch only.
name: c29-darwin-probe

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c29']
    paths: ['.github/c29-darwin-probe/**', '.github/workflows/c29-darwin-probe.yml']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install system dependencies
        run: .github/ci/bounded.sh 300 brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: ../.github/ci/bounded.sh 180 npm ci
      - name: Versions
        run: |
          jq --version; bash --version | head -1; command -v bash jq; sysctl -n hw.ncpu hw.memsize; uptime
      - name: spawnSync with a 128 KB stdin, bare
        working-directory: server
        run: |
          sysctl net.local.stream.sendspace net.local.stream.recvspace kern.ipc.maxsockbuf || true
          w() { node ../.github/c29-darwin-probe/syncspawn.mjs "$@" & p=$!; node ../.github/c29-darwin-probe/watch.mjs "$p" "$2" & q=$!; wait "$p"; kill "$q" 2>/dev/null || true; }
          w 3000 bare-cat-det cat detached
          w 3000 bare-cat-att cat attached
          w 300 bare-jq-det jq detached
      - name: spawnSync with a 128 KB stdin, under a test shard's load
        working-directory: server
        run: |
          ( ./node_modules/.bin/vitest run --maxWorkers=2 test/ccd-child-reclaim-pin.test.ts test/ccd-reclaim-tail-window.test.ts test/ccd-reclaim-tail-mounts.test.ts >/dev/null 2>&1 ) &
          sleep 30
          w() { node ../.github/c29-darwin-probe/syncspawn.mjs "$@" & p=$!; node ../.github/c29-darwin-probe/watch.mjs "$p" "$2" & q=$!; wait "$p"; kill "$q" 2>/dev/null || true; }
          w 3000 shard-cat-det cat detached
          w 600 shard-jq-det jq detached
          w 3000 shard-cat-att cat attached
          kill %1 2>/dev/null || true
      - name: the whole prune-deny file under a test shard's load
        working-directory: server
        run: |
          ( ./node_modules/.bin/vitest run --maxWorkers=2 test/ccd-child-reclaim-pin.test.ts test/ccd-reclaim-tail-window.test.ts test/ccd-reclaim-tail-mounts.test.ts test/ccd-ws-reap.test.ts >/dev/null 2>&1 ) &
          sleep 30
          bash ../.github/c29-darwin-probe/repeat.sh 2 pd-whole test/session-hook-prune-deny.test.ts
          kill %1 2>/dev/null || true
