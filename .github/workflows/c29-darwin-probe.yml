# THROWAWAY (Task C29, D-8354): repeats the prune-deny cost case's jq
# invocation and the two red files on macOS, bare and under a test shard's
# load. Removed before the wave-done; it runs on a push to the task's own
# branch only.
name: c29-darwin-probe

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c29']
    paths: ['.github/c29-darwin-probe/**', '.github/workflows/c29-darwin-probe.yml']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install system dependencies
        run: .github/ci/bounded.sh 300 brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: ../.github/ci/bounded.sh 180 npm ci
      - name: Versions
        run: |
          jq --version; bash --version | head -1; command -v bash jq; sysctl -n hw.ncpu hw.memsize; uptime
      - name: spawnSync with a 128 KB stdin, pipe (control) and file, bare and under a test shard's load
        working-directory: server
        run: |
          w() { node ../.github/c29-darwin-probe/syncspawn.mjs "$@" & p=$!; node ../.github/c29-darwin-probe/watch.mjs "$p" "$2" & q=$!; wait "$p"; kill "$q" 2>/dev/null || true; }
          w 3000 bare-cat-pipe cat detached
          C29_STDIN=file w 6000 bare-cat-file cat detached
          ( ./node_modules/.bin/vitest run --maxWorkers=2 test/ccd-child-reclaim-pin.test.ts test/ccd-reclaim-tail-window.test.ts test/ccd-reclaim-tail-mounts.test.ts >/dev/null 2>&1 ) &
          sleep 30
          w 3000 shard-cat-pipe cat detached
          C29_STDIN=file w 6000 shard-cat-file cat detached
          C29_STDIN=file w 300 shard-jq-file jq detached
          kill %1 2>/dev/null || true
      - name: the fixed files alone, repeated
        working-directory: server
        run: |
          bash ../.github/c29-darwin-probe/repeat.sh 5 pd-cost test/session-hook-prune-deny.test.ts 'dqsub|D-8354|waits half|reads its compute'
          bash ../.github/c29-darwin-probe/repeat.sh 3 cc-bare test/session-hook-compact-carry.test.ts
      - name: the whole fixed prune-deny file under a test shard's load
        working-directory: server
        run: |
          ( ./node_modules/.bin/vitest run --maxWorkers=2 test/ccd-child-reclaim-pin.test.ts test/ccd-reclaim-tail-window.test.ts test/ccd-reclaim-tail-mounts.test.ts test/ccd-ws-reap.test.ts >/dev/null 2>&1 ) &
          sleep 30
          bash ../.github/c29-darwin-probe/repeat.sh 1 pd-whole test/session-hook-prune-deny.test.ts
          bash ../.github/c29-darwin-probe/repeat.sh 2 cc-shard test/session-hook-compact-carry.test.ts
          kill %1 2>/dev/null || true
