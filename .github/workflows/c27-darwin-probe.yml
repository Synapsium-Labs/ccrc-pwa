# THROWAWAY (Task C27, D-2661, D-8344): repeats the platform-hazards
# candidate (b) scenario on macOS with the fixed probe's reader, bare and under
# load, and runs the fixed test file alone repeatedly. Removed before the
# wave-done; it runs on a push to the task's own branch only.
name: c27-darwin-probe

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c27']
    paths: ['.github/c27-darwin-probe/**', '.github/workflows/c27-darwin-probe.yml']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install system dependencies
        run: .github/ci/bounded.sh 300 brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: ../.github/ci/bounded.sh 180 npm ci
      - name: Single reader, bare
        run: bash .github/c27-darwin-probe/single.sh 60 bare
      - name: Single reader, under CPU load
        run: |
          n=$(( $(sysctl -n hw.ncpu) * 2 ))
          for i in $(seq 1 "$n"); do yes >/dev/null & done
          bash .github/c27-darwin-probe/single.sh 100 cpu
          pkill yes || true
      - name: Single reader, under a test shard's load
        working-directory: server
        run: |
          ( ./node_modules/.bin/vitest run --maxWorkers=3 test/ccd-ws-*.test.ts >/dev/null 2>&1 ) &
          sleep 20
          bash ../.github/c27-darwin-probe/single.sh 100 shard
          kill %1 2>/dev/null || true
      - name: The fixed test file alone, repeated, under CPU load
        working-directory: server
        run: |
          n=$(( $(sysctl -n hw.ncpu) * 2 ))
          for i in $(seq 1 "$n"); do yes >/dev/null & done
          bash ../.github/c27-darwin-probe/repeat.sh 15 cpu
          pkill yes || true
