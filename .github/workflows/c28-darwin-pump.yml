# THROWAWAY (Task C28, D-8345): measures the account sign-in helper's pump on
# macOS against a mint that has already finished, bare and under load. Removed
# before the wave-done; it runs on a push to the task's own branch only.
name: c28-darwin-pump

permissions:
  contents: read

on:
  push:
    branches: ['ws/polish-c28']
    paths: ['.github/c28-darwin-pump/**', '.github/workflows/c28-darwin-pump.yml', 'ccd/ccd-account-auth']

jobs:
  pump:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install system dependencies
        run: .github/ci/bounded.sh 300 brew install bash tmux flock jq coreutils
      - name: Install
        working-directory: server
        run: ../.github/ci/bounded.sh 180 npm ci
      - name: Versions
        run: |
          bash --version | head -1; command -v timeout gtimeout; sw_vers; sysctl -n hw.ncpu
          git log -1 --format='%H %s'
      - name: Bare, darwin arm
        env:
          LATE: 'echo line-one; echo line-two; sleep 1; exit 0'
          BETWEEN: 'echo line-one; sleep 1; echo line-two; exit 0'
        run: |
          M=.github/c28-darwin-pump/measure.sh H=ccd/ccd-account-auth
          bash $M $H 20 bare-instant
          bash $M $H 30 bare-late "" "$LATE"
          bash $M $H 30 bare-between "" "$BETWEEN"
      - name: Under 2 x ncpu yes
        env:
          LATE: 'echo line-one; echo line-two; sleep 1; exit 0'
          BETWEEN: 'echo line-one; sleep 1; echo line-two; exit 0'
        run: |
          for _ in $(seq 1 $(( $(sysctl -n hw.ncpu) * 2 ))); do yes >/dev/null & done
          M=.github/c28-darwin-pump/measure.sh H=ccd/ccd-account-auth
          bash $M $H 40 yes-late "" "$LATE"
          bash $M $H 40 yes-between "" "$BETWEEN"
          bash $M $H 30 yes-late-linuxarm linux "$LATE"
          kill $(jobs -p) 2>/dev/null || true
      - name: Under a test shard
        working-directory: server
        env:
          LATE: 'echo line-one; echo line-two; sleep 1; exit 0'
        run: |
          ( ./node_modules/.bin/vitest run --maxWorkers=3 test/ccd-ws-*.test.ts >/dev/null 2>&1 ) &
          sleep 20
          bash ../.github/c28-darwin-pump/measure.sh ../ccd/ccd-account-auth 40 shard-late "" "$LATE"
          kill %1 2>/dev/null || true
      - name: The code channel's peek, bare and under 2 x ncpu yes
        run: |
          bash .github/c28-darwin-pump/code-channel.sh 200 bare
          for _ in $(seq 1 $(( $(sysctl -n hw.ncpu) * 2 ))); do yes >/dev/null & done
          bash .github/c28-darwin-pump/code-channel.sh 200 yes
          kill $(jobs -p) 2>/dev/null || true
      - name: A descendant holding the stream (each run should end expired at about 10 s, never hang)
        env:
          HELD: 'echo alive; (exec sleep 300) & exit 0'
        run: |
          bash .github/c28-darwin-pump/measure.sh ccd/ccd-account-auth 5 held "" "$HELD" || true
          pkill -x sleep || true
      - name: The helper's suites and script-shim-platform alone, five times
        working-directory: server
        run: |
          red=0
          for i in 1 2 3 4 5; do
            if ./node_modules/.bin/vitest run test/ccd-account-auth.test.ts test/ccd-account-auth-private-socket.test.ts test/script-shim-platform.test.ts > "$RUNNER_TEMP/suite-$i.log" 2>&1; then
              echo "repeat $i: green $(grep -E '^ +Tests ' "$RUNNER_TEMP/suite-$i.log")"
            else
              red=$((red+1)); echo "repeat $i: RED"; grep -E '×|FAIL|AssertionError|Tests ' "$RUNNER_TEMP/suite-$i.log" | head -40
            fi
          done
          echo "SUMMARY suites: $red of 5 red"
