# ccrc fleet-host tmux config (~/.tmux.conf on the box that owns the cc-* sessions).
#
# The job: advertise 24-bit truecolor (RGB) to the terminal-drawer's attaching
# xterm-256color client, so Claude Code's full palette — emitted via
# COLORTERM=truecolor at spawn (see ccd _spawn) — passes through instead of being
# quantised to 256 colours (which collapses distinct hues together). Without the
# RGB terminal-feature, tmux 3.4 strips 24-bit down on the way to the client.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
